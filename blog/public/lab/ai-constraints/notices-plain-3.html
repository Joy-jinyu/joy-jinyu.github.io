<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>通知</title>
<style>
/* 「团队空间」App 的设计变量。浅色、深色各一套。
   成对的颜色（accent / on-accent，card 上的 text、text-2、danger）对比度都在 4.5:1 以上；
   accent 当文字用时只能放在 card 上（放在 bg 上只有 4.22:1）。 */
:root {
  --color-accent: #b65a3c;      --color-on-accent: #ffffff;
  --color-bg: #f4f4f1;          --color-card: #ffffff;
  --color-text: #1c1c1a;        --color-text-2: #5f5e59;
  --color-line: #e7e6e1;        --color-danger: #b42318;
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-title: 600 18px/1.4 var(--font-sans);
  --font-body: 400 15px/1.6 var(--font-sans);
  --font-body-strong: 600 15px/1.6 var(--font-sans);
  --font-caption: 400 13px/1.5 var(--font-sans);
  --radius-card: 16px;  --radius-control: 10px;  --radius-pill: 999px;
  --control-h: 44px;    --control-h-sm: 32px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
  --shadow-card: 0 1px 2px rgb(0 0 0 / 0.04), 0 8px 24px rgb(0 0 0 / 0.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-accent: #d97757;    --color-on-accent: #1a1a19;
    --color-bg: #141413;        --color-card: #1f1e1c;
    --color-text: #f0efea;      --color-text-2: #a3a199;
    --color-line: #2f2e2b;      --color-danger: #f97066;
    --shadow-card: 0 1px 2px rgb(0 0 0 / 0.3);
  }
}

/* ---- 页面自身的派生值，全部由上面的变量推出 ---- */
:root {
  /* 按下态底色：tokens 里没有这个角色，用 text 在 card 上叠 8% 推出来，明暗主题自动跟随 */
  --color-pressed: color-mix(in srgb, var(--color-text) 8%, var(--color-card));
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --gutter-left: calc(var(--space-4) + var(--safe-left));
  --gutter-right: calc(var(--space-4) + var(--safe-right));
  --footer-h: calc(var(--control-h) + var(--space-2) * 2 + var(--safe-bottom));
  --dot-size: 8px;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--color-bg);
  color: var(--color-text);
  font: var(--font-body);
  -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(var(--footer-h) + var(--space-5));
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  margin: 0;
  padding: 0;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---- 顶部导航栏 ---- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  padding-top: var(--safe-top);
  padding-left: var(--safe-left);
  padding-right: var(--safe-right);
  background: var(--color-card);
  border-bottom: 1px solid var(--color-line);
}
.topbar__inner {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  height: var(--control-h);
}
.topbar__title {
  margin: 0;
  font: var(--font-title);
  white-space: nowrap;
}
.back-btn {
  justify-self: start;
  display: grid;
  place-items: center;
  width: var(--control-h);
  height: var(--control-h);
  border-radius: var(--radius-control);
}
/* 返回箭头：用边框画的 chevron，不引入图标资源 */
.back-btn__icon {
  width: 10px;
  height: 10px;
  border-left: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: translateX(2px) rotate(45deg);
}
.read-all-btn {
  justify-self: end;
  min-height: var(--control-h);
  padding: 0 var(--space-4);
  border-radius: var(--radius-control);
  color: var(--color-accent);
  font: var(--font-body);
  white-space: nowrap;
}
.back-btn:active,
.read-all-btn:active:not([aria-disabled="true"]) { background: var(--color-pressed); }
.back-btn:focus-visible,
.read-all-btn:focus-visible { outline-offset: -2px; }
.read-all-btn[aria-disabled="true"] {
  color: var(--color-text-2);
  cursor: default;
}
.read-all-btn[aria-busy="true"] { cursor: progress; }

/* ---- 列表 ---- */
.main {
  padding: var(--space-4) var(--gutter-right) 0 var(--gutter-left);
}
.group + .group { margin-top: var(--space-5); }
.group__title {
  margin: 0 0 var(--space-2);
  padding: 0 var(--space-4);
  font: var(--font-caption);
  color: var(--color-text-2);
}
.card {
  margin: 0;
  padding: 0;
  list-style: none;
  background: var(--color-card);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.card > li + li { border-top: 1px solid var(--color-line); }

.notice {
  display: block;
  width: 100%;
  padding: var(--space-3) var(--space-4);
  text-align: left;
}
button.notice:active:not([aria-busy="true"]) { background: var(--color-pressed); }
/* card 有 overflow:hidden，焦点环往里收，免得被裁掉 */
.notice:focus-visible { outline-offset: -2px; }
.notice[aria-busy="true"] { cursor: progress; }

.notice__head {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
}
/* 圆点槽位固定宽度：已读和未读的标题、正文始终对齐在同一条起始线上 */
.notice__dot-slot {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--dot-size);
  height: calc(15px * 1.6); /* 与 --font-body 的行高相等，让圆点落在标题第一行的中线 */
}
.notice__dot {
  width: var(--dot-size);
  height: var(--dot-size);
  border-radius: var(--radius-pill);
  background: var(--color-accent);
}
.notice__title {
  flex: 1;
  min-width: 0;
  font: var(--font-body);
  color: var(--color-text);
  overflow-wrap: anywhere;
}
.notice--unread .notice__title { font: var(--font-body-strong); }
.notice__time {
  flex: none;
  font: var(--font-caption);
  color: var(--color-text-2);
  white-space: nowrap;
  padding-top: 2px; /* 13px 小字与 15px 标题的首行基线对齐 */
}
.notice__body,
.notice__error {
  display: block;
  margin-top: var(--space-1);
  padding-left: calc(var(--dot-size) + var(--space-2));
  overflow-wrap: anywhere;
}
.notice__body {
  font: var(--font-body);
  color: var(--color-text-2);
}
.notice__error {
  font: var(--font-caption);
  color: var(--color-danger);
}
.notice[aria-busy="true"] .notice__head,
.notice[aria-busy="true"] .notice__body { opacity: 0.6; }

/* ---- 加载 / 空 / 错误 ---- */
.state {
  padding: var(--space-5) var(--space-4);
  text-align: center;
  color: var(--color-text-2);
}
.state__title {
  margin: 0;
  font: var(--font-body-strong);
  color: var(--color-text);
}
.state__desc {
  margin: var(--space-1) 0 0;
  font: var(--font-body);
}
.state__action {
  margin-top: var(--space-4);
  min-height: var(--control-h);
  padding: 0 var(--space-5);
  border-radius: var(--radius-control);
  background: var(--color-card);
  border: 1px solid var(--color-line);
  color: var(--color-text);
  font: var(--font-body-strong);
}
.state__action:active { background: var(--color-pressed); }

/* ---- 底部固定按钮 ---- */
.footer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  padding: var(--space-2) var(--gutter-right) calc(var(--space-2) + var(--safe-bottom)) var(--gutter-left);
  background: var(--color-card);
  border-top: 1px solid var(--color-line);
}
.settings-btn {
  display: block;
  width: 100%;
  height: var(--control-h);
  border-radius: var(--radius-control);
  background: var(--color-bg);
  color: var(--color-text);
  font: var(--font-body-strong);
}
.settings-btn:active { background: var(--color-pressed); }

/* ---- 轻提示：只用于整页范围的失败反馈 ---- */
.toast {
  position: fixed;
  left: var(--gutter-left);
  right: var(--gutter-right);
  bottom: calc(var(--footer-h) + var(--space-3));
  z-index: 20;
  display: flex;
  justify-content: center;
  pointer-events: none;
}
.toast__text {
  max-width: 100%;
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-control);
  background: var(--color-text);
  color: var(--color-bg);
  font: var(--font-caption);
  box-shadow: var(--shadow-card);
  opacity: 0;
  transform: translateY(var(--space-1));
  transition: opacity 160ms ease-out, transform 160ms ease-out;
}
.toast__text.is-visible { opacity: 1; transform: none; }
.toast__text:empty { padding: 0; }

@media (prefers-reduced-motion: reduce) {
  .toast__text { transition: none; transform: none; }
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <button type="button" class="back-btn" id="back-btn" aria-label="返回" title="返回">
        <span class="back-btn__icon" aria-hidden="true"></span>
      </button>
      <h1 class="topbar__title">通知</h1>
      <button type="button" class="read-all-btn" id="read-all-btn" aria-disabled="true">全部已读</button>
    </div>
  </header>

  <main class="main" id="main" aria-busy="true">
    <div class="state" id="loading">
      <p class="state__desc">正在加载…</p>
    </div>
  </main>

  <footer class="footer">
    <button type="button" class="settings-btn" id="settings-btn">通知设置</button>
  </footer>

  <div class="toast" role="status" aria-live="polite">
    <span class="toast__text" id="toast"></span>
  </div>

<script>
(() => {
  'use strict';

  const API = {
    list: './api/notices.json',
    read: (id) => `./api/notices/${encodeURIComponent(id)}/read`,
    readAll: './api/notices/read-all',
  };

  const mainEl = document.getElementById('main');
  const readAllBtn = document.getElementById('read-all-btn');
  const toastEl = document.getElementById('toast');

  let notices = [];
  const pendingIds = new Set();
  let readAllPending = false;
  let toastTimer = 0;

  /** 系统边界校验：只保留字段齐全的通知，丢掉的条数打到控制台，不静默吞 */
  function normalize(raw) {
    if (!Array.isArray(raw)) throw new Error('notices payload is not an array');
    const valid = raw.filter((n) =>
      n && (typeof n.id === 'number' || typeof n.id === 'string') &&
      typeof n.group === 'string' && typeof n.title === 'string'
    ).map((n) => ({
      id: n.id,
      group: n.group,
      title: n.title,
      body: typeof n.body === 'string' ? n.body : '',
      time: typeof n.time === 'string' ? n.time : '',
      read: n.read === true,
    }));
    if (valid.length !== raw.length) {
      console.warn(`[notices] dropped ${raw.length - valid.length} malformed item(s)`, raw);
    }
    return valid;
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function errorMessage(status) {
    if (!navigator.onLine) return '网络不可用，请检查网络后重试。';
    if (status === 401 || status === 403) return '登录状态已失效，请重新登录后再试。';
    return '请稍后重试。';
  }

  function showToast(text) {
    clearTimeout(toastTimer);
    toastEl.textContent = text;
    toastEl.classList.add('is-visible');
    toastTimer = setTimeout(() => {
      toastEl.classList.remove('is-visible');
      toastEl.textContent = '';
    }, 3000);
  }

  function syncReadAll() {
    const hasUnread = notices.some((n) => !n.read);
    const disabled = readAllPending || !hasUnread;
    readAllBtn.setAttribute('aria-disabled', String(disabled));
    readAllBtn.setAttribute('aria-busy', String(readAllPending));
    readAllBtn.title = hasUnread ? '' : '没有未读通知';
  }

  /** 一条通知：未读渲染成 button（可点、可聚焦），已读是普通块 */
  function renderNotice(n, errorText) {
    const unread = !n.read;
    const root = el(unread ? 'button' : 'div', `notice${unread ? ' notice--unread' : ''}`);
    root.dataset.id = String(n.id);
    if (unread) {
      root.type = 'button';
      if (pendingIds.has(n.id)) root.setAttribute('aria-busy', 'true');
    }

    const head = el('span', 'notice__head');
    const slot = el('span', 'notice__dot-slot');
    if (unread) {
      const dot = el('span', 'notice__dot');
      dot.setAttribute('aria-hidden', 'true');
      slot.append(dot);
    }
    const title = el('span', 'notice__title');
    if (unread) title.append(el('span', 'visually-hidden', '未读，'));
    title.append(n.title);
    head.append(slot, title, el('span', 'notice__time', n.time));
    root.append(head);

    if (n.body) root.append(el('span', 'notice__body', n.body));
    if (errorText) root.append(el('span', 'notice__error', errorText));
    return root;
  }

  function groupNotices(list) {
    const groups = new Map();
    for (const n of list) {
      if (!groups.has(n.group)) groups.set(n.group, []);
      groups.get(n.group).push(n);
    }
    return groups;
  }

  function renderState({ title, desc, actionText, onAction }) {
    const box = el('div', 'state');
    if (title) box.append(el('p', 'state__title', title));
    if (desc) box.append(el('p', 'state__desc', desc));
    if (actionText) {
      const btn = el('button', 'state__action', actionText);
      btn.type = 'button';
      btn.addEventListener('click', onAction);
      box.append(btn);
    }
    mainEl.replaceChildren(box);
  }

  function renderList() {
    if (notices.length === 0) {
      renderState({ title: '暂无通知', desc: '有新的评论、邀请或系统消息时会显示在这里。' });
      return;
    }
    const frag = document.createDocumentFragment();
    let index = 0;
    for (const [group, items] of groupNotices(notices)) {
      const headingId = `group-${index++}`;
      const section = el('section', 'group');
      section.setAttribute('aria-labelledby', headingId);
      const heading = el('h2', 'group__title', group);
      heading.id = headingId;
      const ul = el('ul', 'card');
      for (const n of items) {
        const li = el('li');
        li.append(renderNotice(n));
        ul.append(li);
      }
      section.append(heading, ul);
      frag.append(section);
    }
    mainEl.replaceChildren(frag);
  }

  /** 原地替换一条通知；原来的节点有焦点时，把焦点交给新节点，避免键盘用户被甩回页首 */
  function replaceNotice(id, errorText) {
    const n = notices.find((x) => x.id === id);
    const oldNode = mainEl.querySelector(`.notice[data-id="${CSS.escape(String(id))}"]`);
    if (!n || !oldNode) return;
    const hadFocus = document.activeElement === oldNode;
    const newNode = renderNotice(n, errorText);
    oldNode.replaceWith(newNode);
    if (hadFocus) {
      if (newNode.tagName !== 'BUTTON') newNode.tabIndex = -1;
      newNode.focus();
    }
  }

  async function load() {
    mainEl.setAttribute('aria-busy', 'true');
    renderState({ desc: '正在加载…' });
    syncReadAll();
    try {
      const res = await fetch(API.list, { cache: 'no-store', headers: { Accept: 'application/json' } });
      if (!res.ok) {
        renderState({ title: '通知没能加载', desc: errorMessage(res.status), actionText: '重新加载', onAction: load });
        return;
      }
      notices = normalize(await res.json());
      renderList();
    } catch (err) {
      console.error('[notices] load failed', err);
      renderState({ title: '通知没能加载', desc: errorMessage(), actionText: '重新加载', onAction: load });
    } finally {
      mainEl.setAttribute('aria-busy', 'false');
      syncReadAll();
    }
  }

  async function markRead(id) {
    const n = notices.find((x) => x.id === id);
    if (!n || n.read || pendingIds.has(id) || readAllPending) return;
    pendingIds.add(id);
    replaceNotice(id);
    let errorText = '';
    try {
      const res = await fetch(API.read(id), { method: 'POST' });
      if (res.ok) {
        notices = notices.map((x) => (x.id === id ? { ...x, read: true } : x));
      } else {
        errorText = `没能标为已读。${errorMessage(res.status)}`;
      }
    } catch (err) {
      console.error('[notices] mark read failed', id, err);
      errorText = `没能标为已读。${errorMessage()}`;
    } finally {
      pendingIds.delete(id);
      replaceNotice(id, errorText);
      syncReadAll();
    }
  }

  async function markAllRead() {
    if (readAllBtn.getAttribute('aria-disabled') === 'true') return;
    readAllPending = true;
    syncReadAll();
    try {
      const res = await fetch(API.readAll, { method: 'POST' });
      if (res.ok) {
        notices = notices.map((x) => (x.read ? x : { ...x, read: true }));
        renderList();
      } else {
        showToast(`没能全部标为已读。${errorMessage(res.status)}`);
      }
    } catch (err) {
      console.error('[notices] mark all read failed', err);
      showToast(`没能全部标为已读。${errorMessage()}`);
    } finally {
      readAllPending = false;
      syncReadAll();
    }
  }

  mainEl.addEventListener('click', (e) => {
    const target = e.target instanceof Element ? e.target.closest('button.notice') : null;
    if (!target) return;
    const n = notices.find((x) => String(x.id) === target.dataset.id);
    if (n) markRead(n.id);
  });

  readAllBtn.addEventListener('click', markAllRead);

  document.getElementById('back-btn').addEventListener('click', () => {
    history.back();
  });

  document.getElementById('settings-btn').addEventListener('click', () => {
    // 目的地未在需求里给出：按实际路由（或 App 桥接方法）替换这一行
    location.href = './notice-settings.html';
  });

  load();
})();
</script>
</body>
</html>
