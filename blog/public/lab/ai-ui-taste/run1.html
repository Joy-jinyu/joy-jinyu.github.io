<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>团队空间</title>
<style>
  :root {
    --bg: #f4f4f1;
    --card: #ffffff;
    --text: #1c1c1a;
    --text-2: #6b6a65;
    --line: #e7e6e1;
    --track: #ecebe6;
    --accent: #c96442;
    --accent-ink: #ffffff;
    --tag-bg: #f6e9e3;
    --tag-ink: #a24f32;
    --danger: #c43d3d;
    --hover: #f3f2ee;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --menu-shadow: 0 2px 6px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --card: #1f1e1c;
      --text: #f0efea;
      --text-2: #a3a199;
      --line: #2f2e2b;
      --track: #2f2e2b;
      --accent: #d97757;
      --accent-ink: #1a1a19;
      --tag-bg: #3a2a23;
      --tag-ink: #eba78d;
      --danger: #ef6b6b;
      --hover: #2a2926;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      --menu-shadow: 0 12px 32px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    position: relative;
    max-width: 420px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-right: 40px;
  }
  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.3;
  }
  .tag {
    font-size: 12px;
    font-weight: 600;
    line-height: 20px;
    padding: 0 8px;
    border-radius: 999px;
    background: var(--tag-bg);
    color: var(--tag-ink);
  }
  .desc {
    margin: 8px 0 0;
    color: var(--text-2);
    font-size: 14px;
  }
  .stats {
    margin: 20px 0 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-of-type { border-bottom: 0; padding-bottom: 8px; }
  .row dt { color: var(--text-2); font-size: 14px; }
  .row dd {
    margin: 0;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .row dd small { color: var(--text-2); font-weight: 400; font-size: 13px; }
  .bar {
    height: 8px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    width: 37.5%;
    border-radius: inherit;
    background: var(--accent);
  }
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .btn {
    flex: 1;
    min-height: 44px;
    border-radius: 10px;
    font: inherit;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform .1s ease, background-color .15s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-secondary { background: transparent; color: var(--text); border-color: var(--line); }
  .btn-secondary:active { background: var(--hover); }
  .btn:focus-visible, .more:focus-visible, .menu button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .more {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--text-2);
    cursor: pointer;
  }
  .more:active, .more[aria-expanded="true"] { background: var(--hover); }
  .dots { display: flex; gap: 3px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

  .menu {
    position: absolute;
    top: 56px;
    right: 12px;
    min-width: 152px;
    margin: 0;
    padding: 6px;
    list-style: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--menu-shadow);
    transform-origin: top right;
    opacity: 0;
    transform: scale(.96) translateY(-4px);
    visibility: hidden;
    transition: opacity .15s ease, transform .15s ease, visibility 0s linear .15s;
    z-index: 10;
  }
  .menu.open {
    opacity: 1;
    transform: none;
    visibility: visible;
    transition: opacity .15s ease, transform .15s ease, visibility 0s;
  }
  .menu button {
    width: 100%;
    min-height: 40px;
    padding: 0 12px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
  }
  .menu button:hover, .menu button:focus-visible { background: var(--hover); }
  .menu .sep { height: 1px; margin: 6px 4px; background: var(--line); }
  .menu .danger { color: var(--danger); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(32px + env(safe-area-inset-bottom));
    transform: translate(-50%, 8px);
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--text);
    color: var(--bg);
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; }
  }
</style>
</head>
<body>
<main>
  <section class="card" aria-labelledby="title">
    <div class="head">
      <h1 id="title">团队空间</h1>
      <span class="tag">Pro</span>
    </div>
    <p class="desc">本周通过 Claude Code 上传了 12GB 文件，还剩 63GB 可用</p>

    <button class="more" id="moreBtn" type="button" aria-label="更多操作" aria-haspopup="menu" aria-expanded="false" aria-controls="moreMenu">
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <ul class="menu" id="moreMenu" role="menu" aria-labelledby="moreBtn">
      <li role="none"><button type="button" role="menuitem" data-action="rename" tabindex="-1">重命名</button></li>
      <li role="none"><button type="button" role="menuitem" data-action="copy" tabindex="-1">复制链接</button></li>
      <li role="separator" class="sep"></li>
      <li role="none"><button type="button" role="menuitem" data-action="delete" class="danger" tabindex="-1">删除</button></li>
    </ul>

    <dl class="stats">
      <div class="row">
        <dt>今日上传文件数</dt>
        <dd><span id="uploadCount">128</span></dd>
      </div>
      <div class="row">
        <dt>已用空间</dt>
        <dd>37.5 <small>/ 100 GB</small></dd>
      </div>
    </dl>
    <div class="bar" role="progressbar" aria-label="已用空间" aria-valuemin="0" aria-valuemax="100" aria-valuenow="37.5" aria-valuetext="已用 37.5 GB，共 100 GB"><span></span></div>

    <div class="actions">
      <button class="btn btn-primary" type="button" data-action="upgrade">升级套餐</button>
      <button class="btn btn-secondary" type="button" data-action="members">管理成员</button>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  (function () {
    var countEl = document.getElementById('uploadCount');
    var count = 128;
    var fmt = new Intl.NumberFormat('zh-CN');
    setInterval(function () {
      count += 1 + Math.floor(Math.random() * 3);
      countEl.textContent = fmt.format(count);
    }, 1000);

    var btn = document.getElementById('moreBtn');
    var menu = document.getElementById('moreMenu');
    var items = Array.prototype.slice.call(menu.querySelectorAll('[role="menuitem"]'));

    function isOpen() { return btn.getAttribute('aria-expanded') === 'true'; }
    function open(focusIndex) {
      menu.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
      items[focusIndex || 0].focus();
    }
    function close(returnFocus) {
      menu.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
      if (returnFocus) btn.focus();
    }

    btn.addEventListener('click', function () {
      isOpen() ? close(false) : open(0);
    });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); open(0); }
      if (e.key === 'ArrowUp') { e.preventDefault(); open(items.length - 1); }
    });
    menu.addEventListener('keydown', function (e) {
      var i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
      else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
      else if (e.key === 'Escape') { e.preventDefault(); close(true); }
      else if (e.key === 'Tab') { close(false); }
    });
    document.addEventListener('pointerdown', function (e) {
      if (isOpen() && !menu.contains(e.target) && !btn.contains(e.target)) close(false);
    });

    var toast = document.getElementById('toast');
    var toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1600);
    }

    var labels = {
      rename: '重命名',
      copy: '链接已复制',
      delete: '已删除',
      upgrade: '前往升级套餐',
      members: '前往管理成员'
    };
    document.addEventListener('click', function (e) {
      var target = e.target.closest('[data-action]');
      if (!target) return;
      var action = target.getAttribute('data-action');
      if (menu.contains(target)) close(true);
      if (action === 'delete' && !window.confirm('确定删除「团队空间」吗？此操作无法撤销。')) return;
      if (action === 'copy' && navigator.clipboard) {
        navigator.clipboard.writeText(location.href).then(
          function () { showToast(labels.copy); },
          function () { showToast('复制失败，请手动复制'); }
        );
        return;
      }
      showToast(labels[action]);
    });
  })();
</script>
</body>
</html>
