<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>团队空间</title>
<style>
  :root {
    --bg: #f4f4f2;
    --card: #ffffff;
    --text: #1c1c1e;
    --text-2: #6b6b70;
    --line: #e6e6e3;
    --track: #ececea;
    --accent: #c4623a;
    --accent-press: #a9512e;
    --accent-soft: #f8e9e2;
    --danger: #d23b2f;
    --menu-hover: #f2f2ef;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --menu-shadow: 0 4px 8px rgba(0,0,0,.06), 0 16px 32px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --card: #1d1d1f;
      --text: #f2f2f2;
      --text-2: #a1a1a6;
      --line: #2e2e31;
      --track: #2b2b2e;
      --accent: #e07a52;
      --accent-press: #c96842;
      --accent-soft: #3a261d;
      --danger: #ff6b5f;
      --menu-hover: #2a2a2d;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --menu-shadow: 0 4px 8px rgba(0,0,0,.3), 0 16px 32px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding: 24px 16px;
  }
  .card {
    position: relative;
    max-width: 420px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-right: 40px;
  }
  .title { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .01em; }
  .badge {
    font-size: 12px;
    font-weight: 600;
    line-height: 20px;
    padding: 0 8px;
    border-radius: 999px;
    color: var(--accent);
    background: var(--accent-soft);
  }
  .desc { margin: 8px 0 0; color: var(--text-2); font-size: 14px; }

  .more {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--text-2);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background-color .15s;
  }
  .more:hover, .more[aria-expanded="true"] { background: var(--menu-hover); color: var(--text); }
  .more:focus-visible, .btn:focus-visible, .menu button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .dots { display: flex; gap: 3px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

  .menu {
    position: absolute;
    top: 56px;
    right: 12px;
    z-index: 10;
    min-width: 148px;
    margin: 0;
    padding: 6px;
    list-style: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--menu-shadow);
    transform-origin: top right;
    opacity: 0;
    transform: scale(.96) translateY(-4px);
    visibility: hidden;
    transition: opacity .14s ease-out, transform .14s ease-out, visibility 0s linear .14s;
  }
  .menu.open {
    opacity: 1;
    transform: none;
    visibility: visible;
    transition: opacity .14s ease-out, transform .14s ease-out, visibility 0s;
  }
  .menu button {
    display: block;
    width: 100%;
    min-height: 40px;
    padding: 0 12px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
  }
  .menu button:hover, .menu button:focus-visible { background: var(--menu-hover); }
  .menu .sep { height: 1px; margin: 4px 6px; background: var(--line); }
  .menu .danger { color: var(--danger); }

  .stats { margin: 20px 0 0; padding: 0; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }
  .row dt { color: var(--text-2); font-size: 14px; }
  .row dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row dd small { color: var(--text-2); font-weight: 400; font-size: 13px; }

  .bar {
    height: 8px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    width: 37.5%;
    border-radius: inherit;
    background: var(--accent);
  }

  .actions { display: flex; gap: 12px; margin-top: 20px; }
  .btn {
    flex: 1;
    min-height: 44px;
    border-radius: 12px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color .15s, transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { border: 0; background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-press); }
  .btn-secondary { border: 1px solid var(--line); background: transparent; color: var(--text); }
  .btn-secondary:hover { background: var(--menu-hover); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 8px);
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--text);
    color: var(--card);
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .menu, .menu.open, .toast, .btn { transition: none; }
  }
</style>
</head>
<body>
<main>
  <section class="card" aria-labelledby="space-title">
    <div class="head">
      <h1 class="title" id="space-title">团队空间</h1>
      <span class="badge">Pro</span>
    </div>
    <p class="desc">本周通过 Claude Code 上传了 12GB 文件，还剩 63GB 可用</p>

    <button class="more" id="moreBtn" type="button" aria-label="更多" aria-haspopup="menu" aria-expanded="false" aria-controls="moreMenu">
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <ul class="menu" id="moreMenu" role="menu" aria-labelledby="moreBtn">
      <li role="none"><button type="button" role="menuitem" tabindex="-1" data-action="重命名">重命名</button></li>
      <li role="none"><button type="button" role="menuitem" tabindex="-1" data-action="复制链接">复制链接</button></li>
      <li role="separator" class="sep"></li>
      <li role="none"><button type="button" role="menuitem" tabindex="-1" class="danger" data-action="删除">删除</button></li>
    </ul>

    <dl class="stats">
      <div class="row">
        <dt>今日上传文件数</dt>
        <dd id="uploadCount">128</dd>
      </div>
      <div class="row">
        <dt>已用空间</dt>
        <dd>37.5 <small>/ 100 GB</small></dd>
      </div>
    </dl>
    <div class="bar" role="progressbar" aria-label="已用空间" aria-valuemin="0" aria-valuemax="100" aria-valuenow="37.5" aria-valuetext="已用 37.5 GB，共 100 GB">
      <span></span>
    </div>

    <div class="actions">
      <button class="btn btn-primary" type="button">升级套餐</button>
      <button class="btn btn-secondary" type="button">管理成员</button>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  (function () {
    var countEl = document.getElementById('uploadCount');
    var count = 128;
    setInterval(function () {
      count += 1 + Math.floor(Math.random() * 3);
      countEl.textContent = count.toLocaleString('zh-CN');
    }, 1000);

    var btn = document.getElementById('moreBtn');
    var menu = document.getElementById('moreMenu');
    var items = Array.prototype.slice.call(menu.querySelectorAll('[role="menuitem"]'));
    var toast = document.getElementById('toast');
    var toastTimer;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1600);
    }

    function isOpen() { return menu.classList.contains('open'); }

    function openMenu(focusIndex) {
      menu.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
      if (typeof focusIndex === 'number') items[focusIndex].focus();
    }

    function closeMenu(returnFocus) {
      if (!isOpen()) return;
      menu.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
      if (returnFocus) btn.focus();
    }

    btn.addEventListener('click', function () {
      if (isOpen()) closeMenu(false); else openMenu(0);
    });

    btn.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); openMenu(0); }
      if (e.key === 'ArrowUp') { e.preventDefault(); openMenu(items.length - 1); }
    });

    menu.addEventListener('keydown', function (e) {
      var i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
      else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
      else if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); }
      else if (e.key === 'Tab') { closeMenu(false); }
    });

    menu.addEventListener('click', function (e) {
      var item = e.target.closest('[role="menuitem"]');
      if (!item) return;
      closeMenu(true);
      showToast('已选择：' + item.dataset.action);
    });

    document.addEventListener('pointerdown', function (e) {
      if (!isOpen()) return;
      if (menu.contains(e.target) || btn.contains(e.target)) return;
      closeMenu(false);
    });
  })();
</script>
</body>
</html>
