# 读者投稿编辑器（Sveltia CMS）。访客用 GitHub 登录后自动 fork 本仓库，稿件标为「待审」时向 master 提 PR。
# PR 的守门规则见 .github/scripts/check-contrib.mjs，字段要和它、和 blog/src/content.config.ts 的 schema 对得上。
backend:
  name: github
  repo: Joy-jinyu/joy-jinyu.github.io
  branch: master
  # 登录中转：sveltia-cms-auth 部署在 Cloudflare Workers 上（Worker 名 pairwise-cms-auth，配 GitHub OAuth App「Pairwise 投稿」）
  base_url: https://pairwise-cms-auth.1825326327.workers.dev
  open_authoring: true
  auth_scope: public_repo
publish_mode: editorial_workflow
site_url: https://www.pairwise.site/blog/
# 访客的素材库是只读的，投稿不支持上传图片；这两项是 CMS 必填
media_folder: blog/public/contrib-images
public_folder: /blog/contrib-images

collections:
  - name: contrib
    label: 投稿
    label_singular: 投稿
    folder: blog/src/content/posts/contrib
    extension: md
    format: frontmatter
    create: true
    # 文件名只能是小写字母、数字、连字符（守门规则），所以不用中文标题做 slug
    slug: "{{year}}-{{month}}-{{day}}-{{uuid_short}}"
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: description, label: 一句话摘要, widget: text, hint: 显示在首页卡片和分享卡片上 }
      - { name: date, label: 日期, widget: datetime, type: date }
      - { name: tags, label: 标签, widget: list, required: false }
      - { name: column, widget: hidden, default: contrib }
      - { name: author, widget: hidden, default: "{{author-login}}" }
      # 只在编辑器里用，保存前由 ai-assist.js 的 preSave 删掉，不会写进文件
      - { name: ai, label: AI 写作助手, widget: ai_assist, required: false }
      - { name: body, label: 正文, widget: markdown, hint: 只支持 Markdown，不能写 HTML 标签 }
