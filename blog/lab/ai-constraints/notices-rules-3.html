<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>通知</title>
<style>
/* ===== 团队设计变量：原样复制自 tokens.css ===== */
/* 「团队空间」App 的设计变量。浅色、深色各一套。
   成对的颜色（accent / on-accent，card 上的 text、text-2、danger）对比度都在 4.5:1 以上；
   accent 当文字用时只能放在 card 上（放在 bg 上只有 4.22:1）。 */
:root {
  --color-accent: #b65a3c;      --color-on-accent: #ffffff;
  --color-bg: #f4f4f1;          --color-card: #ffffff;
  --color-text: #1c1c1a;        --color-text-2: #5f5e59;
  --color-line: #e7e6e1;        --color-danger: #b42318;
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-title: 600 18px/1.4 var(--font-sans);
  --font-body: 400 15px/1.6 var(--font-sans);
  --font-body-strong: 600 15px/1.6 var(--font-sans);
  --font-caption: 400 13px/1.5 var(--font-sans);
  --radius-card: 16px;  --radius-control: 10px;  --radius-pill: 999px;
  --control-h: 44px;    --control-h-sm: 32px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
  --shadow-card: 0 1px 2px rgb(0 0 0 / 0.04), 0 8px 24px rgb(0 0 0 / 0.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-accent: #d97757;    --color-on-accent: #1a1a19;
    --color-bg: #141413;        --color-card: #1f1e1c;
    --color-text: #f0efea;      --color-text-2: #a3a199;
    --color-line: #2f2e2b;      --color-danger: #f97066;
    --shadow-card: 0 1px 2px rgb(0 0 0 / 0.3);
  }
}

/* ===== 页面用的派生量：只由上面的变量和安全区组合，不新定数值 ===== */
:root {
  /* 顶栏、正文、底栏、提示条四层共用这一对留白，左右边才能始终重合 */
  --pad-l: calc(var(--space-4) + env(safe-area-inset-left, 0px));
  --pad-r: calc(var(--space-4) + env(safe-area-inset-right, 0px));
  --bar-bottom-h: calc(var(--control-h) + 2 * var(--space-3) + 1px + env(safe-area-inset-bottom, 0px));
}

/* 字体栈第一位是英文系统字体，引号、破折号、省略号会用上它的窄字形；只把这几个字符交给苹方 / 雅黑 */
@font-face {
  font-family: "CJK Punct";
  src: local("PingFang SC"), local("PingFangSC-Regular"), local("Microsoft YaHei");
  font-weight: 400;
  unicode-range: U+2014, U+2018-2019, U+201C-201D, U+2026;
}
@font-face {
  font-family: "CJK Punct";
  src: local("PingFangSC-Semibold"), local("PingFang SC Semibold"), local("Microsoft YaHei Bold");
  font-weight: 600;
  unicode-range: U+2014, U+2018-2019, U+201C-201D, U+2026;
}

*, *::before, *::after { box-sizing: border-box; }
/* 各处用 font 简写套变量会把字体族重置回 --font-sans，这里统一在最前面补上标点字体 */
body, body * { font-family: "CJK Punct", var(--font-sans) !important; }
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font: var(--font-body);
  text-autospace: normal;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
button {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: start;
  cursor: pointer;
}
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* 单行文字按字形量间距：裁掉行盒上下的空白，再补回汉字冒出 cap 高度的部分 */
@supports (text-box: trim-both cap alphabetic) {
  .trim { text-box: trim-both cap alphabetic; padding-block: 0.16em 0.12em; }
}

/* ===== 顶部导航栏 ===== */
.bar-top {
  position: sticky;
  top: 0;
  padding: env(safe-area-inset-top, 0px) var(--pad-r) 0 var(--pad-l);
  background: var(--color-card);
  border-bottom: 1px solid var(--color-line);
}
.bar-top-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  height: var(--control-h);
}
.bar-title { font: var(--font-title); color: var(--color-text); }
.back {
  justify-self: start;
  display: flex;
  align-items: center;
  width: var(--control-h);
  height: var(--control-h);
  color: var(--color-text);
}
/* 箭头尖贴着左留白线，点击区向右延伸 */
.back::before {
  content: "";
  width: var(--space-3);
  height: var(--space-3);
  margin-left: var(--space-1);
  border-left: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: rotate(45deg);
}
.read-all {
  justify-self: end;
  display: flex;
  align-items: center;
  min-width: var(--control-h);
  height: var(--control-h);
  font: var(--font-body);
  color: var(--color-accent);
}
.read-all > span { display: block; }
.read-all[aria-disabled="true"] { color: var(--color-text-2); cursor: default; }

/* ===== 正文 ===== */
main {
  padding: var(--space-4) var(--pad-r) calc(var(--bar-bottom-h) + var(--space-5)) var(--pad-l);
}
main:focus { outline: none; }
.group + .group { margin-top: var(--space-5); }
.group-title {
  padding-inline: var(--space-4);
  margin-bottom: var(--space-2);
  font: var(--font-caption);
  color: var(--color-text);
}
.card {
  background: var(--color-card);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.card > li + li { border-top: 1px solid var(--color-line); }

.notice {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: baseline;
  column-gap: var(--space-3);
  row-gap: var(--space-2);
  width: 100%;
  padding: var(--space-4);
}
button.notice:active { background: var(--color-bg); }
@media (hover: hover) { button.notice:hover { background: var(--color-bg); } }
button.notice:focus-visible { outline-offset: -2px; }
button.notice[aria-disabled="true"] { cursor: default; }
.notice-title { display: block; font: var(--font-body-strong); color: var(--color-text); }
.notice-time { display: block; font: var(--font-caption); color: var(--color-text-2); white-space: nowrap; }
.notice-body { display: block; grid-column: 1 / -1; font: var(--font-caption); color: var(--color-text-2); }
/* 圆点挂进卡片左内边距里：宽 + 右边距 = 左负边距，标题文字起点不动 */
.dot {
  display: inline-block;
  width: var(--space-2);
  height: var(--space-2);
  margin-left: calc(-1 * (var(--space-2) + var(--space-1)));
  margin-right: var(--space-1);
  border-radius: var(--radius-pill);
  background: var(--color-accent);
  vertical-align: middle;
}

.state {
  display: grid;
  justify-items: start;
  row-gap: var(--space-3);
  padding: var(--space-4);
}
.state-title { font: var(--font-body-strong); color: var(--color-text); }
.state-text { font: var(--font-body); color: var(--color-text-2); }
.btn-secondary {
  display: flex;
  align-items: center;
  height: var(--control-h);
  padding-inline: var(--space-4);
  margin-top: var(--space-1);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-control);
  font: var(--font-body-strong);
  color: var(--color-accent);
}
.btn-secondary > span { display: block; }
.btn-secondary[aria-disabled="true"] { color: var(--color-text-2); cursor: default; }

/* ===== 操作失败的提示条 ===== */
.toast-region {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(var(--bar-bottom-h) + var(--space-3));
  padding-inline: var(--pad-l) var(--pad-r);
  pointer-events: none;
}
.toast {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  column-gap: var(--space-2);
  padding-inline: var(--space-4) var(--space-2);
  background: var(--color-card);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  pointer-events: auto;
}
.toast-msg { padding-block: var(--space-3); font: var(--font-body); color: var(--color-danger); }
@supports (text-box: trim-both cap alphabetic) {
  .toast-msg.trim { padding-block: calc(var(--space-3) + 0.16em) calc(var(--space-3) + 0.12em); }
}
.toast-btn {
  display: flex;
  align-items: center;
  height: var(--control-h);
  padding-inline: var(--space-2);
  font: var(--font-body-strong);
  color: var(--color-accent);
}
.toast-btn > span { display: block; }
.toast-btn[aria-disabled="true"] { color: var(--color-text-2); cursor: default; }
.toast-btn.is-quiet { font: var(--font-body); color: var(--color-text-2); }

/* ===== 底部固定按钮 ===== */
.bar-bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: var(--space-3) var(--pad-r) calc(var(--space-3) + env(safe-area-inset-bottom, 0px)) var(--pad-l);
  background: var(--color-card);
  border-top: 1px solid var(--color-line);
}
.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  height: var(--control-h);
  border-radius: var(--radius-control);
  background: var(--color-accent);
  color: var(--color-on-accent);
  font: var(--font-body-strong);
  text-decoration: none;
}
.btn-primary > span { display: block; }
</style>
</head>
<body>
<header class="bar-top">
  <div class="bar-top-row">
    <button type="button" class="back" id="back" aria-label="返回"></button>
    <h1 class="bar-title trim">通知</h1>
    <button type="button" class="read-all" id="read-all" aria-disabled="true"><span class="trim">全部已读</span></button>
  </div>
</header>

<main id="main" tabindex="-1">
  <div class="card state" id="loading" role="status">
    <p class="state-text trim">正在加载通知…</p>
  </div>

  <div class="card state" id="load-error" hidden>
    <p class="state-title trim">通知没有加载出来</p>
    <p class="state-text trim" id="load-error-msg"></p>
    <button type="button" class="btn-secondary" id="retry-load"><span class="trim">重新加载</span></button>
  </div>

  <div class="card state" id="empty" hidden>
    <p class="state-text trim">暂时没有通知</p>
  </div>

  <div id="list" hidden></div>
</main>

<div class="toast-region" id="toast-region" aria-live="assertive"></div>

<footer class="bar-bottom">
  <a class="btn-primary" href="./notice-settings.html"><span class="trim">通知设置</span></a>
</footer>

<script>
(() => {
  const API = {
    list: './api/notices.json',
    readOne: (id) => `./api/notices/${encodeURIComponent(id)}/read`,
    readAll: './api/notices/read-all',
  }
  const TIMEOUT_MS = 15000

  const $ = (id) => document.getElementById(id)
  const ui = {
    main: $('main'),
    loading: $('loading'),
    loadError: $('load-error'),
    loadErrorMsg: $('load-error-msg'),
    retryLoad: $('retry-load'),
    empty: $('empty'),
    list: $('list'),
    readAll: $('read-all'),
    toastRegion: $('toast-region'),
  }

  let notices = []
  let loaded = false
  let readAllPending = false
  const pendingIds = new Set()

  class RequestError extends Error {
    constructor(kind, status) {
      super(kind)
      this.kind = kind
      this.status = status
    }
  }

  /** 老 WebView 没有 AbortSignal.timeout 时用 AbortController 兜底 */
  function timeoutSignal(ms) {
    if (typeof AbortSignal.timeout === 'function') return AbortSignal.timeout(ms)
    const ctrl = new AbortController()
    setTimeout(() => ctrl.abort(new DOMException('timeout', 'TimeoutError')), ms)
    return ctrl.signal
  }

  const isTimeout = (err) => err && (err.name === 'TimeoutError' || err.name === 'AbortError')

  /** 发请求；超时、断网、非 2xx 都抛 RequestError，调用方只需区分成功和失败 */
  async function request(url, init = {}) {
    let res
    try {
      res = await fetch(url, { ...init, signal: timeoutSignal(TIMEOUT_MS), headers: { Accept: 'application/json' } })
    } catch (err) {
      throw new RequestError(isTimeout(err) ? 'timeout' : 'network')
    }
    if (!res.ok) throw new RequestError('http', res.status)
    return res
  }

  function describe(err) {
    if (!(err instanceof RequestError)) {
      console.error(err)
      return '出了点问题，请稍后再试。'
    }
    if (err.kind === 'timeout') return `等了 ${TIMEOUT_MS / 1000} 秒还没有回应，可能是网络不好，请再试一次。`
    if (err.kind === 'network') return '网络连接不上，检查网络后再试一次。'
    if (err.kind === 'format') return '收到的数据格式不对，请稍后再试。'
    return `服务暂时出了问题（错误码 ${err.status}），请稍后再试。`
  }

  const isText = (v) => typeof v === 'string'
  const isId = (v) => (typeof v === 'number' && Number.isFinite(v)) || (isText(v) && v !== '')

  function parseNotices(data) {
    if (!Array.isArray(data)) throw new RequestError('format')
    const valid = data.filter((n) => n && isId(n.id) && isText(n.group) && isText(n.title) && isText(n.body) && isText(n.time) && typeof n.read === 'boolean')
    if (valid.length !== data.length) console.warn(`通知数据里有 ${data.length - valid.length} 条字段不全，已跳过`, data)
    return valid.map((n) => ({ id: n.id, group: n.group, title: n.title, body: n.body, time: n.time, read: n.read }))
  }

  /* ---------- 渲染 ---------- */

  const el = (tag, className, text) => {
    const node = document.createElement(tag)
    if (className) node.className = className
    if (text !== undefined) node.textContent = text
    return node
  }

  function buildNotice(n) {
    const box = el(n.read ? 'div' : 'button', 'notice')
    box.dataset.id = String(n.id)
    if (!n.read) box.type = 'button'
    const title = el('span', 'notice-title trim')
    if (!n.read) {
      const dot = el('span', 'dot')
      dot.append(el('span', 'sr', '未读，'))
      title.append(dot)
    }
    title.append(n.title)
    box.append(title, el('span', 'notice-time trim', n.time), el('span', 'notice-body trim', n.body))
    return box
  }

  function renderList() {
    const groups = new Map()
    for (const n of notices) {
      if (!groups.has(n.group)) groups.set(n.group, [])
      groups.get(n.group).push(n)
    }
    const sections = [...groups].map(([name, items], i) => {
      const section = el('section', 'group')
      const heading = el('h2', 'group-title trim', name)
      heading.id = `group-${i}`
      section.setAttribute('aria-labelledby', heading.id)
      const ul = el('ul', 'card')
      for (const n of items) {
        const li = el('li')
        li.append(buildNotice(n))
        ul.append(li)
      }
      section.append(heading, ul)
      return section
    })
    ui.list.replaceChildren(...sections)
  }

  function updateReadAll() {
    const hasUnread = notices.some((n) => !n.read)
    ui.readAll.setAttribute('aria-disabled', String(!loaded || !hasUnread || readAllPending))
    ui.readAll.firstElementChild.textContent = readAllPending ? '标记中…' : '全部已读'
  }

  const noticeButton = (id) => ui.list.querySelector(`button.notice[data-id="${CSS.escape(String(id))}"]`)

  function setItemBusy(id, busy) {
    const btn = noticeButton(id)
    if (!btn) return
    const n = notices.find((x) => x.id === id)
    btn.setAttribute('aria-disabled', String(busy))
    btn.setAttribute('aria-busy', String(busy))
    btn.querySelector('.notice-time').textContent = busy ? '标记中…' : n.time
  }

  /** 焦点要离开即将被替换或藏起来的元素时，落到下一条未读；没有就落到正文 */
  function focusNextUnread(leaving) {
    const buttons = [...ui.list.querySelectorAll('button.notice')].filter((b) => !leaving.includes(b))
    const anchor = leaving[0]
    const next = buttons.find((b) => anchor && anchor.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING) || buttons[buttons.length - 1]
    ;(next || ui.main).focus()
  }

  /** 把这些通知标为已读：更新数据，再把对应的按钮换成不可点的条目 */
  function applyRead(ids) {
    const idSet = new Set(ids)
    notices = notices.map((n) => (idSet.has(n.id) ? { ...n, read: true } : n))
    const leaving = ids.map(noticeButton).filter(Boolean)
    if (leaving.includes(document.activeElement)) focusNextUnread(leaving)
    for (const btn of leaving) {
      const n = notices.find((x) => String(x.id) === btn.dataset.id)
      btn.replaceWith(buildNotice(n))
    }
    updateReadAll()
  }

  /* ---------- 操作失败提示 ---------- */

  let toast = null

  function hideToast(focusTarget) {
    if (!toast) return
    if (toast.node.contains(document.activeElement)) (focusTarget() || ui.main).focus()
    toast.node.remove()
    toast = null
  }

  /**
   * 操作失败时在底栏上方给提示，带「重试」和「关闭」。
   * retry 返回 Promise<Error|null>；returnFocus / successFocus 给出关闭、重试成功后焦点落在哪里。
   */
  function showToast(prefix, err, { retry, returnFocus, successFocus }) {
    hideToast(returnFocus)
    const node = el('div', 'toast')
    const msg = el('p', 'toast-msg trim', `${prefix}${describe(err)}`)
    const retryBtn = el('button', 'toast-btn')
    retryBtn.type = 'button'
    retryBtn.append(el('span', 'trim', '重试'))
    const closeBtn = el('button', 'toast-btn is-quiet')
    closeBtn.type = 'button'
    closeBtn.append(el('span', 'trim', '关闭'))
    node.append(msg, retryBtn, closeBtn)
    ui.toastRegion.append(node)
    const current = { node }
    toast = current

    retryBtn.addEventListener('click', async () => {
      if (retryBtn.getAttribute('aria-disabled') === 'true') return
      retryBtn.setAttribute('aria-disabled', 'true')
      retryBtn.firstElementChild.textContent = '重试中…'
      const again = await retry()
      if (toast !== current) return
      if (!again) {
        hideToast(successFocus)
        return
      }
      msg.textContent = `${prefix}${describe(again)}`
      retryBtn.setAttribute('aria-disabled', 'false')
      retryBtn.firstElementChild.textContent = '重试'
    })
    closeBtn.addEventListener('click', () => hideToast(returnFocus))
  }

  /* ---------- 标为已读 ---------- */

  async function readOne(id) {
    pendingIds.add(id)
    setItemBusy(id, true)
    try {
      await request(API.readOne(id), { method: 'POST' })
      applyRead([id])
      return null
    } catch (err) {
      return err
    } finally {
      pendingIds.delete(id)
      setItemBusy(id, false)
    }
  }

  async function readAll() {
    readAllPending = true
    updateReadAll()
    try {
      await request(API.readAll, { method: 'POST' })
      readAllPending = false
      applyRead(notices.filter((n) => !n.read).map((n) => n.id))
      return null
    } catch (err) {
      return err
    } finally {
      readAllPending = false
      updateReadAll()
    }
  }

  ui.list.addEventListener('click', async (e) => {
    const btn = e.target.closest('button.notice')
    if (!btn) return
    const n = notices.find((x) => String(x.id) === btn.dataset.id)
    if (!n || n.read || pendingIds.has(n.id) || readAllPending) return
    hideToast(() => null)
    const err = await readOne(n.id)
    if (err) {
      showToast('没能标为已读：', err, {
        retry: () => readOne(n.id),
        returnFocus: () => noticeButton(n.id),
        successFocus: () => ui.list.querySelector('button.notice'),
      })
    }
  })

  ui.readAll.addEventListener('click', async () => {
    if (ui.readAll.getAttribute('aria-disabled') === 'true') return
    hideToast(() => null)
    const err = await readAll()
    if (err) showToast('没能全部标为已读：', err, { retry: readAll, returnFocus: () => ui.readAll, successFocus: () => ui.readAll })
  })

  /* ---------- 加载 ---------- */

  async function fetchNotices() {
    const res = await request(API.list, { cache: 'no-store' })
    let data
    try {
      data = await res.json()
    } catch (err) {
      throw new RequestError(isTimeout(err) ? 'timeout' : 'format')
    }
    return parseNotices(data)
  }

  function showContent() {
    const target = notices.length ? ui.list : ui.empty
    target.hidden = false
    // 重试按钮马上要被藏起来，先把焦点交给正文
    if (ui.loadError.contains(document.activeElement)) ui.main.focus()
    ui.loading.hidden = true
    ui.loadError.hidden = true
  }

  function showLoadError(err) {
    ui.loadErrorMsg.textContent = describe(err)
    ui.loadError.hidden = false
    ui.loading.hidden = true
  }

  async function load() {
    try {
      notices = await fetchNotices()
      loaded = true
      renderList()
      showContent()
    } catch (err) {
      showLoadError(err)
    }
    updateReadAll()
  }

  ui.retryLoad.addEventListener('click', async () => {
    if (ui.retryLoad.getAttribute('aria-disabled') === 'true') return
    ui.retryLoad.setAttribute('aria-disabled', 'true')
    ui.retryLoad.firstElementChild.textContent = '加载中…'
    await load()
    ui.retryLoad.setAttribute('aria-disabled', 'false')
    ui.retryLoad.firstElementChild.textContent = '重新加载'
  })

  $('back').addEventListener('click', () => history.back())

  load()
})()
</script>
</body>
</html>
