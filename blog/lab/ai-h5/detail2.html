<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<title>文件详情</title>
<style>
  :root {
    /* 间距阶梯：4 控件内零件 / 8 紧密相关 / 12 组内 / 16 组间与页面内边距 / 24 区块之间 */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-6: 24px;

    --nav-h: 44px;
    --composer-h: 52px;
    --tap: 44px;
    --avatar: 36px;
    --radius-s: 8px;
    --radius-m: 12px;
    --radius-pill: 999px;

    --font-body: 15px;
    --font-small: 13px;
    --font-title: 17px;
    --font-name: 18px;

    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-sunken: #eef0f3;
    --text: #1a1d23;
    --text-secondary: #5c6370;
    --text-disabled: #a3a9b4;
    --divider: #e3e6eb;
    --accent: #1f6feb;
    --accent-text-on: #ffffff;
    --accent-soft: #e6effd;
    --favorite: #b26a00;
    --favorite-soft: #fff3df;
    --focus-ring: #1f6feb;
    --pressed: rgba(0, 0, 0, 0.06);
    --toast-bg: #1a1d23;
    --toast-text: #ffffff;
    --thumb-icon: #d1242f;
    --avatar-text: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #181b21;
      --surface-sunken: #22262e;
      --text: #e8eaee;
      --text-secondary: #a0a7b4;
      --text-disabled: #5d6470;
      --divider: #2a2f38;
      --accent: #5b9bff;
      --accent-text-on: #0b1220;
      --accent-soft: #1b2a44;
      --favorite: #f0b14a;
      --favorite-soft: #3a2c12;
      --focus-ring: #7fb1ff;
      --pressed: rgba(255, 255, 255, 0.08);
      --toast-bg: #e8eaee;
      --toast-text: #0f1115;
      --thumb-icon: #ff6b6b;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    /* 滚动定位（含键盘聚焦、新评论滚入）时避开吸顶和吸底栏 */
    scroll-padding-top: calc(var(--nav-h) + env(safe-area-inset-top));
    scroll-padding-bottom: calc(var(--composer-h) + env(safe-area-inset-bottom));
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: var(--font-body)/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-tap-highlight-color: transparent;
    /* 给吸底评论栏让出位置，内容不被遮住 */
    padding-bottom: calc(var(--composer-h) + env(safe-area-inset-bottom));
  }

  button, input { font: inherit; color: inherit; }

  button {
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
  }

  :focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  .icon {
    width: 24px;
    height: 24px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- 顶部导航 ---------- */
  .nav {
    position: sticky;
    top: 0;
    z-index: 10;
    padding-top: env(safe-area-inset-top);
    background: var(--surface);
    /* 用阴影画分隔线，不占高度，栏高就等于 --nav-h */
    box-shadow: 0 1px 0 var(--divider);
  }

  .nav__bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    height: var(--nav-h);
    padding: 0 var(--space-1);
  }

  .nav__title {
    margin: 0;
    font-size: var(--font-title);
    font-weight: 600;
    white-space: nowrap;
  }

  .nav__end {
    display: flex;
    justify-content: flex-end;
  }

  .icon-btn {
    display: inline-grid;
    place-items: center;
    width: var(--tap);
    height: var(--tap);
    border-radius: var(--radius-pill);
  }

  .icon-btn:active { background: var(--pressed); }

  /* ---------- 文件信息 ---------- */
  .file {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--space-6) var(--space-4);
    background: var(--surface);
    text-align: center;
  }

  .file__thumb {
    display: grid;
    place-items: center;
    width: 120px;
    aspect-ratio: 3 / 4;
    border-radius: var(--radius-s);
    background: var(--surface-sunken);
    color: var(--thumb-icon);
  }

  .file__thumb .icon {
    width: 48px;
    height: 48px;
    stroke-width: 1.4;
  }

  .file__name {
    margin: var(--space-4) 0 0;
    max-width: 100%;
    font-size: var(--font-name);
    font-weight: 600;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }

  .file__meta {
    margin: var(--space-1) 0 0;
    font-size: var(--font-small);
    color: var(--text-secondary);
  }

  /* ---------- 操作栏 ---------- */
  .actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    margin: 0;
    padding: 0 var(--space-2) var(--space-4);
    list-style: none;
    background: var(--surface);
  }

  .action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-1);
    width: 100%;
    min-height: 64px;
    padding: var(--space-2) var(--space-1);
    border-radius: var(--radius-m);
    font-size: var(--font-small);
    color: var(--text);
  }

  .action:active { background: var(--pressed); }

  .action__label { line-height: 1.3; }

  .action[data-favorited="true"] { color: var(--favorite); }
  .action[data-favorited="true"] .icon { fill: currentColor; }

  /* ---------- 评论 ---------- */
  .comments {
    margin-top: var(--space-2);
    background: var(--surface);
  }

  .comments__title {
    margin: 0;
    padding: var(--space-4) var(--space-4) var(--space-1);
    font-size: var(--font-body);
    font-weight: 600;
  }

  .comment-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .comment {
    position: relative;
    display: grid;
    grid-template-columns: var(--avatar) 1fr auto;
    column-gap: var(--space-3);
    padding: var(--space-3) var(--space-1) var(--space-3) var(--space-4);
  }

  /* 分隔线从正文列起，和头像左侧留白分开 */
  .comment + .comment::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    left: calc(var(--space-4) + var(--avatar) + var(--space-3));
    border-top: 1px solid var(--divider);
  }

  .avatar {
    display: grid;
    place-items: center;
    width: var(--avatar);
    height: var(--avatar);
    border-radius: 50%;
    font-size: var(--font-small);
    font-weight: 600;
    color: var(--avatar-text);
  }

  .comment__body { min-width: 0; }

  .comment__head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    column-gap: var(--space-2);
  }

  .comment__name {
    font-size: var(--font-small);
    font-weight: 600;
    overflow-wrap: anywhere;
  }

  .comment__time {
    font-size: var(--font-small);
    color: var(--text-secondary);
  }

  .comment__text {
    margin: var(--space-1) 0 0;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  .like {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-1);
    min-width: var(--tap);
    height: var(--tap);
    /* 点赞按钮比头像高，上移半个差值让两者中线对齐 */
    margin-top: calc((var(--avatar) - var(--tap)) / 2);
    padding: 0 var(--space-3);
    border-radius: var(--radius-pill);
    font-size: var(--font-small);
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .like .icon { width: 20px; height: 20px; }
  .like:active { background: var(--pressed); }

  .like[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
  .like[aria-pressed="true"] .icon { fill: currentColor; }

  /* ---------- 吸底评论栏 ---------- */
  .composer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--surface);
    /* 同上，栏高等于 --composer-h，body 底部留白和滚动避让才能对齐 */
    box-shadow: 0 -1px 0 var(--divider);
    will-change: transform;
  }

  .composer__form {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    height: var(--composer-h);
    padding: 0 var(--space-4);
  }

  .composer__input {
    flex: 1;
    min-width: 0;
    height: 36px;
    padding: 0 var(--space-3);
    border: 1px solid transparent;
    border-radius: var(--radius-pill);
    background: var(--surface-sunken);
    /* 16px 以下 iOS 聚焦时会自动放大页面 */
    font-size: 16px;
  }

  .composer__input::placeholder { color: var(--text-secondary); }

  .composer__input:focus { outline: none; border-color: var(--focus-ring); }

  .composer__send {
    flex: none;
    min-width: 60px;
    height: 36px;
    padding: 0 var(--space-4);
    border-radius: var(--radius-pill);
    background: var(--accent);
    color: var(--accent-text-on);
    font-weight: 600;
  }

  .composer__send:active { filter: brightness(0.92); }

  .composer__send:disabled {
    background: var(--surface-sunken);
    color: var(--text-disabled);
    cursor: default;
    filter: none;
  }

  /* ---------- 轻提示 ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--composer-h) + env(safe-area-inset-bottom) + var(--space-4));
    z-index: 20;
    max-width: calc(100% - 2 * var(--space-4));
    padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-s);
    background: var(--toast-bg);
    color: var(--toast-text);
    font-size: var(--font-small);
    opacity: 0;
    transform: translate(-50%, 4px);
    transition: opacity 0.16s ease, transform 0.16s ease;
    pointer-events: none;
  }

  .toast.is-visible {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 13.5h7M8.5 17h4.5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.1 5.6.8-4 3.9.9 5.6-5-2.6-5 2.6.9-5.6-4-3.9 5.6-.8z"/></symbol>
  <symbol id="i-rename" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14 8l3 3"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M3.5 7a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M10 13h6M13.5 10.5L16 13l-2.5 2.5"/></symbol>
  <symbol id="i-like" viewBox="0 0 24 24"><path d="M7.5 10.5V20H5a1 1 0 0 1-1-1v-7.5a1 1 0 0 1 1-1zM7.5 10.5l3.6-6.3a1.6 1.6 0 0 1 3 .9L13.5 9h5a2 2 0 0 1 2 2.3l-1.1 6.9a2 2 0 0 1-2 1.8H7.5"/></symbol>
</svg>

<header class="nav">
  <div class="nav__bar">
    <div>
      <button type="button" class="icon-btn" id="btn-back" aria-label="返回" title="返回">
        <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
      </button>
    </div>
    <h1 class="nav__title">文件详情</h1>
    <div class="nav__end">
      <button type="button" class="icon-btn" data-todo="分享" aria-label="分享" title="分享">
        <svg class="icon" aria-hidden="true"><use href="#i-share"/></svg>
      </button>
      <button type="button" class="icon-btn" data-todo="更多" aria-label="更多" title="更多">
        <svg class="icon" aria-hidden="true"><use href="#i-more"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="file" aria-labelledby="file-name">
    <div class="file__thumb" aria-hidden="true">
      <svg class="icon"><use href="#i-file"/></svg>
    </div>
    <h2 class="file__name" id="file-name">2026Q3 报告.pdf</h2>
    <p class="file__meta">2.4 MB · 10月28日修改</p>
  </section>

  <ul class="actions" aria-label="文件操作">
    <li>
      <button type="button" class="action" data-todo="下载">
        <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
        <span class="action__label">下载</span>
      </button>
    </li>
    <li>
      <button type="button" class="action" id="btn-favorite" data-favorited="false">
        <svg class="icon" aria-hidden="true"><use href="#i-star"/></svg>
        <span class="action__label">收藏</span>
      </button>
    </li>
    <li>
      <button type="button" class="action" data-todo="重命名">
        <svg class="icon" aria-hidden="true"><use href="#i-rename"/></svg>
        <span class="action__label">重命名</span>
      </button>
    </li>
    <li>
      <button type="button" class="action" data-todo="移动">
        <svg class="icon" aria-hidden="true"><use href="#i-move"/></svg>
        <span class="action__label">移动</span>
      </button>
    </li>
  </ul>

  <section class="comments" aria-labelledby="comments-title">
    <h2 class="comments__title" id="comments-title">评论 · <span id="comment-count">3</span></h2>
    <ul class="comment-list" id="comment-list"></ul>
  </section>
</main>

<div class="composer" id="composer">
  <form class="composer__form" id="composer-form" autocomplete="off">
    <label for="composer-input" class="sr-only">评论内容</label>
    <input class="composer__input" id="composer-input" type="text" placeholder="写评论…" maxlength="500" enterkeyhint="send">
    <button class="composer__send" id="composer-send" type="submit" disabled>发送</button>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<template id="comment-tpl">
  <li class="comment">
    <span class="avatar" aria-hidden="true"></span>
    <div class="comment__body">
      <div class="comment__head">
        <span class="comment__name"></span>
        <time class="comment__time"></time>
      </div>
      <p class="comment__text"></p>
    </div>
    <button type="button" class="like" aria-pressed="false">
      <svg class="icon" aria-hidden="true"><use href="#i-like"/></svg>
      <span class="sr-only">赞</span>
      <span class="like__count"></span>
    </button>
  </li>
</template>

<script>
(function () {
  var AVATAR_COLORS = ['#3b6fd8', '#2f8f6a', '#b2532f', '#7a4fc2', '#a23d6d'];

  var comments = [
    { name: '林晓', time: '10月28日 14:20', text: '第三部分的同比数据是不是少了一个季度？', likes: 4 },
    { name: '陈默', time: '10月28日 16:05', text: '已经补上了，麻烦再看一下第 12 页。', likes: 2 },
    { name: 'Alex Wong', time: '10月29日 09:31', text: '整体没问题，周五前可以对外发。', likes: 7 }
  ];

  var listEl = document.getElementById('comment-list');
  var countEl = document.getElementById('comment-count');
  var tpl = document.getElementById('comment-tpl');
  var form = document.getElementById('composer-form');
  var input = document.getElementById('composer-input');
  var sendBtn = document.getElementById('composer-send');
  var composer = document.getElementById('composer');
  var toastEl = document.getElementById('toast');
  var toastTimer = 0;

  function colorFor(name) {
    var sum = 0;
    for (var i = 0; i < name.length; i++) sum += name.charCodeAt(i);
    return AVATAR_COLORS[sum % AVATAR_COLORS.length];
  }

  function renderComment(c) {
    var node = tpl.content.firstElementChild.cloneNode(true);
    var avatar = node.querySelector('.avatar');
    avatar.textContent = c.name.charAt(0).toUpperCase();
    avatar.style.background = colorFor(c.name);
    node.querySelector('.comment__name').textContent = c.name;
    node.querySelector('.comment__time').textContent = c.time;
    node.querySelector('.comment__text').textContent = c.text;
    node.querySelector('.like__count').textContent = c.likes;
    node.querySelector('.like').dataset.likes = c.likes;
    return node;
  }

  function updateCount() {
    countEl.textContent = listEl.children.length;
  }

  comments.forEach(function (c) { listEl.appendChild(renderComment(c)); });
  updateCount();

  // 点赞：再点一次取消，数字回到原值
  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.like');
    if (!btn) return;
    var base = Number(btn.dataset.likes);
    var pressed = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', String(pressed));
    btn.querySelector('.like__count').textContent = pressed ? base + 1 : base;
  });

  // 收藏：文字随状态变化，所以不再加 aria-pressed，避免读屏重复播报
  var favBtn = document.getElementById('btn-favorite');
  favBtn.addEventListener('click', function () {
    var on = favBtn.dataset.favorited !== 'true';
    favBtn.dataset.favorited = String(on);
    favBtn.querySelector('.action__label').textContent = on ? '已收藏' : '收藏';
  });

  document.getElementById('btn-back').addEventListener('click', function () {
    if (history.length > 1) history.back();
    else showToast('没有上一页');
  });

  function showToast(msg) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('is-visible');
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('is-visible');
    }, 2000);
  }

  // 演示页没有接入真实能力，点击给出如实反馈，不假装成功
  document.querySelectorAll('[data-todo]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      showToast('演示页：「' + btn.dataset.todo + '」未接入');
    });
  });

  function syncSendState() {
    sendBtn.disabled = input.value.trim() === '';
  }

  input.addEventListener('input', syncSendState);

  // 点「发送」时不让输入框失焦，软键盘保持打开，方便连续评论
  sendBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    var node = renderComment({ name: '我', time: '刚刚', text: text, likes: 0 });
    listEl.appendChild(node);
    updateCount();
    input.value = '';
    syncSendState();
    node.scrollIntoView({ block: 'nearest' });
  });

  // iOS 软键盘弹起时只缩小 visual viewport，fixed 底栏会被盖住；按差值把它顶到键盘上方
  var vv = window.visualViewport;
  if (vv) {
    var placeComposer = function () {
      var hidden = window.innerHeight - vv.height - vv.offsetTop;
      composer.style.transform = hidden > 1 ? 'translateY(' + -hidden + 'px)' : '';
    };
    vv.addEventListener('resize', placeComposer);
    vv.addEventListener('scroll', placeComposer);
  }
})();
</script>
</body>
</html>
