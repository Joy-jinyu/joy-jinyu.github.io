<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>文件详情</title>
<style>
  :root {
    /* 间距阶梯：2 微调 / 4 控件内部 / 8 紧密相关 / 12 组内 / 16 组间 / 24 区块间 */
    --sp-1: 2px;
    --sp-2: 4px;
    --sp-3: 8px;
    --sp-4: 12px;
    --sp-5: 16px;
    --sp-6: 24px;

    --nav-h: 44px;
    --bar-h: 56px;
    --tap: 44px;
    --radius: 10px;

    --bg: #f2f3f5;
    --surface: #ffffff;
    --surface-2: #f2f3f5;
    --text: #17191c;
    --text-2: #5e6470;
    --line: #e3e5e8;
    --brand: #1f5fd6;
    --brand-ink: #ffffff;
    --fav: #a85a00;
    --pressed: rgba(0, 0, 0, .06);
    --focus: #1f5fd6;
    --toast-bg: rgba(23, 25, 28, .92);
    --toast-ink: #ffffff;
    --avatar-1: #3a6fd8;
    --avatar-2: #b4562b;
    --avatar-3: #2f8a5b;
    --avatar-me: #6b4fc8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f12;
      --surface: #1a1c20;
      --surface-2: #26292e;
      --text: #eceef1;
      --text-2: #a2a8b3;
      --line: #2e3137;
      --brand: #6d9eff;
      --brand-ink: #0e0f12;
      --fav: #f2b33d;
      --pressed: rgba(255, 255, 255, .08);
      --focus: #6d9eff;
      --toast-bg: rgba(236, 238, 241, .94);
      --toast-ink: #17191c;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    scroll-padding-top: calc(var(--nav-h) + env(safe-area-inset-top));
    scroll-padding-bottom: calc(var(--bar-h) + env(safe-area-inset-bottom) + var(--sp-3));
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(var(--bar-h) + env(safe-area-inset-bottom));
  }
  h1, h2, p, ul { margin: 0; }
  ul { padding: 0; list-style: none; }
  button, input { font: inherit; color: inherit; }
  button {
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  .icon {
    width: 24px; height: 24px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* 顶部导航 */
  .nav {
    position: sticky;
    top: 0;
    z-index: 10;
    padding-top: env(safe-area-inset-top);
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    height: var(--nav-h);
    max-width: 640px;
    margin: 0 auto;
    padding: 0 var(--sp-2);
    display: grid;
    grid-template-columns: 1fr minmax(0, auto) 1fr;
    align-items: center;
  }
  .nav-title {
    min-width: 0;
    font-size: 17px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-start { justify-self: start; }
  .nav-end { justify-self: end; display: flex; }
  .icon-btn {
    width: var(--tap);
    height: var(--tap);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius);
  }

  main { max-width: 640px; margin: 0 auto; }
  .block { background: var(--surface); }
  .block + .block { margin-top: var(--sp-3); }

  /* 文件信息 */
  .file {
    padding: var(--sp-6) var(--sp-5) var(--sp-5);
    text-align: center;
  }
  .thumb {
    width: 88px;
    height: 112px;
    margin: 0 auto var(--sp-5);
    border-radius: 8px;
    background: var(--surface-2);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: var(--sp-4);
    color: var(--text-2);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
  }
  .file-name {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  .file-meta {
    margin-top: var(--sp-2);
    font-size: 13px;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }

  /* 操作行 */
  .actions {
    margin-top: var(--sp-6);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--sp-3);
  }
  .action {
    min-height: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    border-radius: var(--radius);
    font-size: 13px;
    color: var(--text);
  }
  .action[aria-pressed="true"] { color: var(--fav); }
  .action[aria-pressed="true"] .icon { fill: currentColor; }

  /* 评论 */
  .comments { padding: var(--sp-5) var(--sp-5) var(--sp-3); }
  .comments-title {
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .comment-list { margin-top: var(--sp-3); }
  .comment {
    --avatar: 36px;
    position: relative;
    display: grid;
    grid-template-columns: var(--avatar) 1fr auto;
    column-gap: var(--sp-4);
    padding: var(--sp-4) 0;
  }
  /* 分隔线从正文列起笔，和名字、内容对齐在同一条左边线上 */
  .comment + .comment::before {
    content: "";
    position: absolute;
    top: 0;
    left: calc(var(--avatar) + var(--sp-4));
    right: 0;
    border-top: 1px solid var(--line);
  }
  .avatar {
    width: var(--avatar);
    height: var(--avatar);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
  }
  .comment-head {
    display: flex;
    align-items: baseline;
    gap: var(--sp-3);
    flex-wrap: wrap;
  }
  .comment-name { font-size: 14px; font-weight: 600; }
  .comment-time { font-size: 12px; color: var(--text-2); }
  .comment-text {
    margin-top: var(--sp-2);
    font-size: 15px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .like {
    align-self: start;
    min-width: var(--tap);
    min-height: var(--tap);
    margin: calc(var(--sp-4) * -1) calc(var(--sp-3) * -1) 0 0;
    padding: var(--sp-4) var(--sp-3) 0;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    gap: var(--sp-2);
    color: var(--text-2);
    font-size: 13px;
    line-height: 20px;
    font-variant-numeric: tabular-nums;
    border-radius: var(--radius);
  }
  .like .icon { width: 20px; height: 20px; }
  .like-count { min-width: 2ch; text-align: left; }
  .like[aria-pressed="true"] { color: var(--brand); }
  .like[aria-pressed="true"] .icon { fill: currentColor; }

  /* 底部评论栏 */
  .bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 10;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bar-form {
    height: var(--bar-h);
    max-width: 640px;
    margin: 0 auto;
    padding: 0 var(--sp-5);
    display: flex;
    align-items: center;
    gap: var(--sp-3);
  }
  .bar-input {
    flex: 1;
    min-width: 0;
    height: 38px;
    padding: 0 var(--sp-4);
    border: 0;
    border-radius: 19px;
    background: var(--surface-2);
    font-size: 16px; /* 低于 16px 时 iOS 聚焦会自动放大页面 */
  }
  .bar-input::placeholder { color: var(--text-2); opacity: 1; }
  .send {
    flex: none;
    height: 38px;
    min-width: 64px;
    padding: 0 var(--sp-5);
    border-radius: 19px;
    background: var(--brand);
    color: var(--brand-ink);
    font-size: 15px;
    font-weight: 600;
  }
  .send:disabled {
    background: var(--surface-2);
    color: var(--text-2);
    cursor: not-allowed;
  }

  /* 轻提示 */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--bar-h) + env(safe-area-inset-bottom) + var(--sp-5));
    z-index: 20;
    max-width: calc(100% - 2 * var(--sp-6));
    padding: var(--sp-3) var(--sp-5);
    border-radius: var(--radius);
    background: var(--toast-bg);
    color: var(--toast-ink);
    font-size: 14px;
    transform: translate(-50%, var(--sp-3));
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.is-on { opacity: 1; transform: translate(-50%, 0); }

  /* 交互态 */
  .icon-btn:active, .action:active, .like:active { background: var(--pressed); }
  .send:not(:disabled):active { filter: brightness(.9); }
  @media (hover: hover) {
    .icon-btn:hover, .action:hover, .like:hover { background: var(--pressed); }
    .send:not(:disabled):hover { filter: brightness(1.06); }
  }
  @media (prefers-reduced-motion: reduce) {
    .toast { transition: opacity .2s ease; transform: translate(-50%, 0); }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></symbol>
  <symbol id="i-rename" viewBox="0 0 24 24"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M13.5 8.5l2 2"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 13h7M13.5 10.5L16 13l-2.5 2.5"/></symbol>
  <symbol id="i-like" viewBox="0 0 24 24"><path d="M7 10v10H4V10zM7 10l4-7a2 2 0 0 1 2.8 1.9L13 9h5.6a2 2 0 0 1 2 2.4l-1.4 7a2 2 0 0 1-2 1.6H7z"/></symbol>
</svg>

<header class="nav">
  <div class="nav-inner">
    <div class="nav-start">
      <button class="icon-btn" type="button" id="back" aria-label="返回" title="返回">
        <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
      </button>
    </div>
    <span class="nav-title">文件详情</span>
    <div class="nav-end">
      <button class="icon-btn" type="button" data-todo="分享" aria-label="分享" title="分享">
        <svg class="icon" aria-hidden="true"><use href="#i-share"/></svg>
      </button>
      <button class="icon-btn" type="button" data-todo="更多" aria-label="更多" title="更多">
        <svg class="icon" aria-hidden="true"><use href="#i-more"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="block file" aria-labelledby="file-name">
    <div class="thumb" aria-hidden="true">PDF</div>
    <h1 class="file-name" id="file-name">2026Q3 报告.pdf</h1>
    <p class="file-meta">2.4&nbsp;MB · 10月28日修改</p>

    <div class="actions">
      <button class="action" type="button" data-todo="下载">
        <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
        <span>下载</span>
      </button>
      <button class="action" type="button" id="fav" aria-pressed="false">
        <svg class="icon" aria-hidden="true"><use href="#i-star"/></svg>
        <span class="fav-label">收藏</span>
      </button>
      <button class="action" type="button" data-todo="重命名">
        <svg class="icon" aria-hidden="true"><use href="#i-rename"/></svg>
        <span>重命名</span>
      </button>
      <button class="action" type="button" data-todo="移动">
        <svg class="icon" aria-hidden="true"><use href="#i-move"/></svg>
        <span>移动</span>
      </button>
    </div>
  </section>

  <section class="block comments" aria-labelledby="comments-title">
    <h2 class="comments-title" id="comments-title">评论 · <span id="comment-count">3</span></h2>
    <ul class="comment-list" id="comment-list">
      <li class="comment">
        <div class="avatar" style="background: var(--avatar-1)" aria-hidden="true">林</div>
        <div class="comment-body">
          <p class="comment-head"><span class="comment-name">林晓</span><time class="comment-time" datetime="2026-10-28T14:20">10月28日 14:20</time></p>
          <p class="comment-text">第 12 页的营收数据和上个季度的口径不一样，建议加个脚注说明。</p>
        </div>
        <button class="like" type="button" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="#i-like"/></svg>
          <span class="sr-only">赞</span><span class="like-count">5</span>
        </button>
      </li>
      <li class="comment">
        <div class="avatar" style="background: var(--avatar-2)" aria-hidden="true">周</div>
        <div class="comment-body">
          <p class="comment-head"><span class="comment-name">周一鸣</span><time class="comment-time" datetime="2026-10-29T09:05">10月29日 09:05</time></p>
          <p class="comment-text">收到，周五前我把脚注补上。</p>
        </div>
        <button class="like" type="button" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="#i-like"/></svg>
          <span class="sr-only">赞</span><span class="like-count">2</span>
        </button>
      </li>
      <li class="comment">
        <div class="avatar" style="background: var(--avatar-3)" aria-hidden="true">陈</div>
        <div class="comment-body">
          <p class="comment-head"><span class="comment-name">陈思</span><time class="comment-time" datetime="2026-10-30T18:42">10月30日 18:42</time></p>
          <p class="comment-text">附录里的图表能不能导出一份高清版？要放进下周的汇报材料。</p>
        </div>
        <button class="like" type="button" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="#i-like"/></svg>
          <span class="sr-only">赞</span><span class="like-count">0</span>
        </button>
      </li>
    </ul>
  </section>
</main>

<footer class="bar">
  <form class="bar-form" id="comment-form" autocomplete="off">
    <label class="sr-only" for="comment-input">评论</label>
    <input class="bar-input" id="comment-input" type="text" placeholder="写评论…" maxlength="500" enterkeyhint="send">
    <button class="send" id="send" type="submit" disabled>发送</button>
  </form>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr-only" id="sr-status" role="status" aria-live="polite"></div>

<script>
(function () {
  var toastEl = document.getElementById('toast');
  var srStatus = document.getElementById('sr-status');
  var toastTimer = 0;

  function toast(msg) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('is-on');
    toastTimer = setTimeout(function () { toastEl.classList.remove('is-on'); }, 2000);
  }

  document.getElementById('back').addEventListener('click', function () {
    if (history.length > 1) history.back();
    else toast('没有上一页');
  });

  // 演示页：下载、分享等没有接后端，给出可见反馈，避免成为点了没反应的死按钮
  document.querySelectorAll('[data-todo]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      toast('演示页面，「' + btn.dataset.todo + '」暂未接入');
    });
  });

  var fav = document.getElementById('fav');
  fav.addEventListener('click', function () {
    var on = fav.getAttribute('aria-pressed') !== 'true';
    fav.setAttribute('aria-pressed', String(on));
    fav.querySelector('.fav-label').textContent = on ? '已收藏' : '收藏';
  });

  var list = document.getElementById('comment-list');
  list.addEventListener('click', function (e) {
    var btn = e.target.closest('.like');
    if (!btn) return;
    var on = btn.getAttribute('aria-pressed') !== 'true';
    var countEl = btn.querySelector('.like-count');
    countEl.textContent = String(Number(countEl.textContent) + (on ? 1 : -1));
    btn.setAttribute('aria-pressed', String(on));
  });

  var form = document.getElementById('comment-form');
  var input = document.getElementById('comment-input');
  var send = document.getElementById('send');
  var countEl = document.getElementById('comment-count');

  function syncSend() { send.disabled = input.value.trim() === ''; }
  input.addEventListener('input', syncSend);

  function buildComment(text) {
    var li = document.createElement('li');
    li.className = 'comment';
    li.innerHTML =
      '<div class="avatar" style="background: var(--avatar-me)" aria-hidden="true">我</div>' +
      '<div class="comment-body">' +
        '<p class="comment-head"><span class="comment-name">我</span><time class="comment-time">刚刚</time></p>' +
        '<p class="comment-text"></p>' +
      '</div>' +
      '<button class="like" type="button" aria-pressed="false">' +
        '<svg class="icon" aria-hidden="true"><use href="#i-like"/></svg>' +
        '<span class="sr-only">赞</span><span class="like-count">0</span>' +
      '</button>';
    li.querySelector('time').setAttribute('datetime', new Date().toISOString());
    li.querySelector('.comment-text').textContent = text;
    return li;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    var li = buildComment(text);
    list.appendChild(li);
    countEl.textContent = String(list.children.length);
    input.value = '';
    syncSend();
    li.scrollIntoView({ block: 'nearest' });
    srStatus.textContent = '评论已发送';
  });

  syncSend();
})();
</script>
</body>
</html>
