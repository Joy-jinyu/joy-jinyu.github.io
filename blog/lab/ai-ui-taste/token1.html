<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>团队空间</title>
<style>
  :root {
    --color-accent: #b65a3c;      /* 主色 */
    --color-on-accent: #ffffff;   /* 主色上的文字 */
    --color-text: #1c1c1a;
    --color-text-2: #5f5e59;
    --color-line: #e7e6e1;
    --color-bg: #f4f4f1;
    --color-card: #ffffff;
    --radius-card: 16px;
    --radius-control: 10px;
    --font-sm: 13px;
    --font-md: 15px;
    --font-lg: 18px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: var(--space-5) var(--space-4);
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    font-size: var(--font-md);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    max-width: 480px;
    margin: 0 auto;
    padding: var(--space-4);
    background: var(--color-card);
    border: 1px solid var(--color-line);
    border-radius: var(--radius-card);
  }

  .card__head {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding-right: calc(36px + var(--space-2));
  }

  .card__title {
    margin: 0;
    font-size: var(--font-lg);
    font-weight: 600;
    line-height: 1.3;
  }

  .badge {
    padding: 0 var(--space-2);
    border-radius: var(--radius-control);
    background: var(--color-accent);
    color: var(--color-on-accent);
    font-size: var(--font-sm);
    font-weight: 600;
    line-height: 22px;
  }

  .card__desc {
    margin: var(--space-2) 0 0;
    color: var(--color-text-2);
    font-size: var(--font-sm);
  }

  .stats {
    margin: var(--space-4) 0 0;
    padding: var(--space-3) 0 0;
    border-top: 1px solid var(--color-line);
  }

  .stat {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-2) 0;
  }

  .stat dt {
    color: var(--color-text-2);
    font-size: var(--font-sm);
  }

  .stat dd {
    margin: 0;
    font-size: var(--font-lg);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .stat dd small {
    color: var(--color-text-2);
    font-size: var(--font-sm);
    font-weight: 400;
  }

  .progress {
    height: 8px;
    margin-top: var(--space-1);
    border-radius: var(--radius-control);
    background: var(--color-line);
    overflow: hidden;
  }

  .progress__bar {
    height: 100%;
    border-radius: inherit;
    background: var(--color-accent);
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3);
    margin-top: var(--space-5);
  }

  .btn {
    min-height: 44px;
    padding: 0 var(--space-4);
    border: 1px solid transparent;
    border-radius: var(--radius-control);
    font: inherit;
    font-size: var(--font-md);
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:focus-visible,
  .more:focus-visible,
  .menu__item:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  .btn--primary {
    background: var(--color-accent);
    color: var(--color-on-accent);
  }

  .btn--secondary {
    background: var(--color-card);
    border-color: var(--color-line);
    color: var(--color-text);
  }

  .btn:active { opacity: .8; }

  .more {
    position: absolute;
    top: var(--space-3);
    right: var(--space-3);
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 0;
    border-radius: var(--radius-control);
    background: transparent;
    color: var(--color-text-2);
    font-size: var(--font-lg);
    line-height: 1;
    letter-spacing: 1px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .more:active,
  .more[aria-expanded="true"] { background: var(--color-bg); }

  .menu {
    position: absolute;
    top: calc(var(--space-3) + 36px + var(--space-1));
    right: var(--space-3);
    z-index: 10;
    min-width: 140px;
    margin: 0;
    padding: var(--space-1);
    list-style: none;
    background: var(--color-card);
    border: 1px solid var(--color-line);
    border-radius: var(--radius-control);
  }

  .menu[hidden] { display: none; }

  .menu__item {
    display: block;
    width: 100%;
    padding: var(--space-2) var(--space-3);
    border: 0;
    border-radius: var(--radius-control);
    background: transparent;
    color: var(--color-text);
    font: inherit;
    font-size: var(--font-md);
    text-align: left;
    cursor: pointer;
  }

  .menu__item:active { background: var(--color-bg); }

  .menu__item--danger { color: var(--color-accent); }
</style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="space-title">
      <header class="card__head">
        <h1 class="card__title" id="space-title">团队空间</h1>
        <span class="badge">Pro</span>
      </header>

      <button class="more" type="button" id="more-btn"
              aria-label="更多" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">···</button>
      <ul class="menu" id="more-menu" role="menu" aria-labelledby="more-btn" hidden>
        <li role="none"><button class="menu__item" type="button" role="menuitem">重命名</button></li>
        <li role="none"><button class="menu__item" type="button" role="menuitem">复制链接</button></li>
        <li role="none"><button class="menu__item menu__item--danger" type="button" role="menuitem">删除</button></li>
      </ul>

      <p class="card__desc">本周通过 Claude Code 上传了 12GB 文件，还剩 63GB 可用</p>

      <dl class="stats">
        <div class="stat">
          <dt>今日上传文件数</dt>
          <dd><span id="upload-count" aria-live="off">128</span></dd>
        </div>
        <div class="stat">
          <dt>已用空间</dt>
          <dd>37.5 <small>/ 100 GB</small></dd>
        </div>
        <div class="progress" role="progressbar" aria-label="已用空间" aria-valuemin="0" aria-valuemax="100" aria-valuenow="37.5">
          <div class="progress__bar" style="width: 37.5%"></div>
        </div>
      </dl>

      <div class="actions">
        <button class="btn btn--primary" type="button">升级套餐</button>
        <button class="btn btn--secondary" type="button">管理成员</button>
      </div>
    </section>
  </main>

<script>
  (function () {
    var countEl = document.getElementById('upload-count');
    var count = Number(countEl.textContent);
    setInterval(function () {
      count += 1 + Math.floor(Math.random() * 3);
      countEl.textContent = count;
    }, 1000);

    var moreBtn = document.getElementById('more-btn');
    var menu = document.getElementById('more-menu');

    function setOpen(open) {
      menu.hidden = !open;
      moreBtn.setAttribute('aria-expanded', String(open));
      if (open) menu.querySelector('.menu__item').focus();
    }

    moreBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      setOpen(menu.hidden);
    });

    menu.addEventListener('click', function (e) {
      if (e.target.closest('.menu__item')) {
        setOpen(false);
        moreBtn.focus();
      }
    });

    document.addEventListener('click', function (e) {
      if (!menu.hidden && !menu.contains(e.target)) setOpen(false);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !menu.hidden) {
        setOpen(false);
        moreBtn.focus();
      }
    });
  })();
</script>
</body>
</html>
