<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>团队空间</title>
<style>
  :root {
    --bg: #f4f4f2;
    --card: #ffffff;
    --text: #1c1c1e;
    --text-2: #6b6b70;
    --line: #e7e7e4;
    --track: #ececea;
    --accent: #2f5bea;
    --accent-press: #2549c4;
    --badge-bg: #eef2ff;
    --badge-text: #2f4bc0;
    --danger: #d13b2f;
    --menu-hover: #f2f2f0;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --menu-shadow: 0 4px 12px rgba(0,0,0,.08), 0 16px 40px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --card: #1c1c1f;
      --text: #f2f2f3;
      --text-2: #9a9aa1;
      --line: #2c2c31;
      --track: #2c2c31;
      --accent: #5b7cff;
      --accent-press: #4a69e6;
      --badge-bg: #23294a;
      --badge-text: #aab9ff;
      --danger: #ff6b5e;
      --menu-hover: #26262b;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      --menu-shadow: 0 8px 32px rgba(0,0,0,.5);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }

  .card {
    position: relative;
    max-width: 420px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
  }

  .head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-right: 40px;
  }
  .title {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.3;
  }
  .badge {
    flex: none;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--badge-bg);
    color: var(--badge-text);
  }
  .desc {
    margin: 8px 0 0;
    font-size: 14px;
    color: var(--text-2);
  }

  /* 更多按钮：图标 20px，热区 44px，靠视觉对齐卡片内边距 */
  .more {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--text-2);
    cursor: pointer;
  }
  .more:active, .more[aria-expanded="true"] { background: var(--menu-hover); }
  .more:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dots { display: flex; gap: 3px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

  .menu {
    position: absolute;
    top: 52px;
    right: 8px;
    z-index: 10;
    min-width: 152px;
    margin: 0;
    padding: 6px;
    list-style: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--menu-shadow);
    transform-origin: top right;
    opacity: 0;
    transform: scale(.96) translateY(-4px);
    visibility: hidden;
    transition: opacity .14s ease, transform .14s ease, visibility 0s linear .14s;
  }
  .menu.open {
    opacity: 1;
    transform: none;
    visibility: visible;
    transition: opacity .14s ease, transform .14s ease;
  }
  .menu button {
    width: 100%;
    min-height: 44px;
    padding: 0 12px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .menu button:hover, .menu button:focus-visible { background: var(--menu-hover); outline: none; }
  .menu .sep { height: 1px; margin: 4px 6px; background: var(--line); }
  .menu .danger { color: var(--danger); }

  .stats {
    margin: 20px 0 0;
    padding: 16px 0 0;
    border-top: 1px solid var(--line);
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .row + .row { margin-top: 12px; }
  .row dt { color: var(--text-2); font-size: 14px; }
  .row dd {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .row dd .unit { font-size: 13px; font-weight: 400; color: var(--text-2); }

  .bar {
    margin-top: 10px;
    height: 6px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: var(--accent);
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
  }
  .btn {
    min-height: 44px;
    border-radius: 12px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background-color .12s ease, transform .12s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { border: 0; background: var(--accent); color: #fff; }
  .btn-primary:active { background: var(--accent-press); }
  .btn-secondary { border: 1px solid var(--line); background: transparent; color: var(--text); }
  .btn-secondary:active { background: var(--menu-hover); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(32px + env(safe-area-inset-bottom));
    transform: translate(-50%, 8px);
    padding: 10px 16px;
    border-radius: 10px;
    background: rgba(28,28,30,.92);
    color: #fff;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; }
  }
</style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="space-title">
      <div class="head">
        <h1 class="title" id="space-title">团队空间</h1>
        <span class="badge">Pro</span>
      </div>
      <p class="desc">本周通过 Claude Code 上传了 12GB 文件，还剩 63GB 可用</p>

      <button class="more" id="moreBtn" type="button" aria-label="更多" aria-haspopup="menu" aria-expanded="false" aria-controls="moreMenu">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <ul class="menu" id="moreMenu" role="menu" aria-labelledby="moreBtn">
        <li role="none"><button type="button" role="menuitem" data-action="重命名">重命名</button></li>
        <li role="none"><button type="button" role="menuitem" data-action="复制链接">复制链接</button></li>
        <li role="separator" class="sep"></li>
        <li role="none"><button type="button" role="menuitem" class="danger" data-action="删除">删除</button></li>
      </ul>

      <dl class="stats">
        <div class="row">
          <dt>今日上传文件数</dt>
          <dd><span id="uploadCount" aria-live="off">128</span> <span class="unit">个</span></dd>
        </div>
        <div class="row">
          <dt>已用空间</dt>
          <dd>37.5 <span class="unit">/ 100 GB</span></dd>
        </div>
        <div class="bar" role="progressbar" aria-label="已用空间" aria-valuemin="0" aria-valuemax="100" aria-valuenow="37.5">
          <span style="width: 37.5%"></span>
        </div>
      </dl>

      <div class="actions">
        <button class="btn btn-primary" type="button">升级套餐</button>
        <button class="btn btn-secondary" type="button">管理成员</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  // 今日上传数：每秒刷新一次，每次随机增长 0~3
  var countEl = document.getElementById('uploadCount');
  var count = 128;
  setInterval(function () {
    count += Math.floor(Math.random() * 4);
    countEl.textContent = count.toLocaleString('zh-CN');
  }, 1000);

  // 更多菜单
  var btn = document.getElementById('moreBtn');
  var menu = document.getElementById('moreMenu');
  var items = Array.prototype.slice.call(menu.querySelectorAll('[role="menuitem"]'));

  function openMenu() {
    menu.classList.add('open');
    btn.setAttribute('aria-expanded', 'true');
    items[0].focus();
  }
  function closeMenu(returnFocus) {
    if (!menu.classList.contains('open')) return;
    menu.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
    if (returnFocus) btn.focus();
  }

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    menu.classList.contains('open') ? closeMenu(false) : openMenu();
  });

  document.addEventListener('click', function (e) {
    if (!menu.contains(e.target)) closeMenu(false);
  });

  menu.addEventListener('keydown', function (e) {
    var i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === 'Escape') { closeMenu(true); }
    else if (e.key === 'Tab') { closeMenu(false); }
  });

  menu.addEventListener('click', function (e) {
    var item = e.target.closest('[role="menuitem"]');
    if (!item) return;
    closeMenu(true);
    showToast('已选择：' + item.dataset.action);
  });

  // 轻提示
  var toast = document.getElementById('toast');
  var toastTimer;
  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1600);
  }
})();
</script>
</body>
</html>
