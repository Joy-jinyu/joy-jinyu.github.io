<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>文件 · 更多操作</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f8; --surface: #fff; --text: #22252d; --muted: #777d89;
      --line: #e9ebef; --hover: #f1f3f7; --accent: #5268d9; --danger: #cc414b;
      --shadow: 0 12px 40px #18213b18, 0 2px 6px #18213b0a;
      --radius: 16px; --gap: 24px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15171c; --surface: #202329; --text: #eceef3; --muted: #999fac;
        --line: #32363e; --hover: #2e333e; --accent: #a1afff; --danger: #ff8891;
        --shadow: 0 12px 40px #0005, 0 2px 6px #0003;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--bg); color: var(--text); font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 12vh 24px 60px; }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    main { max-width: 720px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; gap: var(--gap); }
    h1 { font-size: 26px; letter-spacing: -.7px; margin: 0 0 4px; font-weight: 650; }
    header p { margin: 0; color: var(--muted); }
    .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .files { list-style: none; padding: 0; margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    .file { display: flex; align-items: center; gap: 16px; padding: 20px; }
    .file + .file { border-top: 1px solid var(--line); }
    .file-icon { flex: 0 0 44px; height: 48px; border: 1px solid var(--line); border-radius: 10px; display: grid; place-items: center; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .4px; background: var(--hover); }
    .details { flex: 1; min-width: 0; }
    .name { margin: 0 0 3px; font-size: 14px; font-weight: 550; overflow-wrap: anywhere; }
    .meta { color: var(--muted); font-size: 12px; }
    .more { flex: 0 0 44px; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; }
    .more:hover, .more[aria-expanded="true"] { background: var(--hover); }
    .dots { display: flex; gap: 3px; }
    .dots i { height: 4px; width: 4px; background: currentColor; border-radius: 50%; }
    .hint { color: var(--muted); font-size: 12px; margin: 18px 4px; }
    .menu { position: fixed; z-index: 10; width: 216px; max-width: calc(100vw - 24px); padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--shadow); opacity: 0; transform: translateY(-5px) scale(.96); transform-origin: top right; transition: opacity 140ms ease, transform 140ms ease; pointer-events: none; }
    .menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; transition-duration: 180ms; transition-timing-function: cubic-bezier(.2,.8,.2,1); }
    .menu.above { transform-origin: bottom right; }
    .menu button { width: 100%; min-height: 44px; border: none; background: transparent; text-align: left; padding: 10px 12px; border-radius: 7px; display: flex; align-items: center; gap: 12px; }
    .menu button:hover, .menu button:focus-visible { background: var(--hover); outline: none; }
    .menu button:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
    .symbol { width: 20px; text-align: center; color: var(--muted); font-size: 17px; }
    .separator { border-top: 1px solid var(--line); margin: 5px 7px; }
    .menu .danger, .danger .symbol { color: var(--danger); }
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 18px; text-align: center; z-index: 20; }
    .toast:empty { display: none; }
    dialog { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; width: min(400px, calc(100% - 32px)); box-shadow: var(--shadow); }
    dialog::backdrop { background: #0006; }
    dialog h2 { font-size: 18px; margin: 0 0 16px; }
    dialog p { overflow-wrap: anywhere; }
    dialog label { display: block; margin-bottom: 8px; color: var(--muted); }
    dialog input { width: 100%; padding: 10px 12px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .actions button { border: 1px solid var(--line); background: var(--hover); border-radius: 8px; min-height: 44px; padding: 8px 18px; }
    .actions .primary { color: var(--accent); }
    .empty { text-align: center; padding: 36px; color: var(--muted); }
    @media (max-width: 520px) { body { padding: 44px 16px; } .file { padding: 16px 12px; gap: 12px; } h1 { font-size: 24px; } .meta { font-size: 11px; } }
    @media (prefers-reduced-motion: reduce) { .menu, .menu.open { transition: none; transform: none; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>我的文件</h1><p>把灵感和日常，整理在这里。</p></div><span class="count" id="count"></span></header>
    <ul class="files" id="files" aria-label="文件列表"></ul>
    <p class="hint">本地交互演示 · 更改仅在本次打开期间保留</p>
  </main>
  <div class="menu" id="menu" role="menu" aria-label="文件操作" hidden inert>
    <button role="menuitem" tabindex="-1" data-action="rename"><span class="symbol" aria-hidden="true">✎</span>重命名</button>
    <button role="menuitem" tabindex="-1" data-action="copy"><span class="symbol" aria-hidden="true">↗</span>复制链接</button>
    <button role="menuitem" tabindex="-1" data-action="move"><span class="symbol" aria-hidden="true">▱</span>移到文件夹</button>
    <div class="separator" role="separator"></div>
    <button role="menuitem" tabindex="-1" data-action="delete" class="danger"><span class="symbol" aria-hidden="true">×</span>删除</button>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form id="form"><h2 id="dialog-title"></h2><p id="description"></p><div id="field"><label for="value" id="label"></label><input id="value" maxlength="120" required autocomplete="off"></div><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" id="confirm" type="submit">保存</button></div></form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const records = [
      { id: 'notes', name: '秋日灵感手记.md', type: 'MD', size: '12 KB', date: '今天 10:24', folder: '' },
      { id: 'design', name: '品牌设计方案.pdf', type: 'PDF', size: '2.8 MB', date: '昨天 16:08', folder: '' },
      { id: 'plan', name: '十月项目计划.xlsx', type: 'XLS', size: '86 KB', date: '10 月 22 日', folder: '' }
    ];
    const files = document.querySelector('#files');
    const menu = document.querySelector('#menu');
    const items = [...menu.querySelectorAll('button')];
    const dialog = document.querySelector('#dialog');
    const input = document.querySelector('#value');
    let activeButton = null, activeRecord = null, opened = false, closeTimer, toastTimer, action;
    function render() {
      files.replaceChildren();
      for (const record of records) {
        const row = document.createElement('li');
        row.className = 'file';
        const icon = document.createElement('span');
        icon.className = 'file-icon'; icon.textContent = record.type; icon.setAttribute('aria-hidden', 'true');
        const details = document.createElement('div'); details.className = 'details';
        const name = document.createElement('h2'); name.className = 'name'; name.textContent = record.name;
        const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = `${record.size} · ${record.date}${record.folder ? ' · ' + record.folder : ''}`;
        const button = document.createElement('button'); button.className = 'more'; button.dataset.id = record.id;
        button.setAttribute('aria-label', `${record.name}，更多操作`); button.setAttribute('aria-haspopup', 'menu'); button.setAttribute('aria-expanded', 'false'); button.setAttribute('aria-controls', 'menu');
        button.innerHTML = '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>';
        button.addEventListener('click', () => opened && activeButton === button ? closeMenu(true) : openMenu(button, record));
        button.addEventListener('keydown', event => { if (['ArrowDown', 'ArrowUp'].includes(event.key)) { event.preventDefault(); openMenu(button, record, event.key === 'ArrowUp'); } });
        details.append(name, meta); row.append(icon, details, button); files.append(row);
      }
      document.querySelector('#count').textContent = `${records.length} 个文件`;
      if (!records.length) { const empty = document.createElement('li'); empty.className = 'empty'; empty.textContent = '文件已清空'; files.append(empty); }
    }
    function positionMenu() {
      const rect = activeButton.getBoundingClientRect();
      const height = menu.offsetHeight;
      const above = rect.bottom + height + 8 > innerHeight - 12 && rect.top > height + 8;
      menu.classList.toggle('above', above);
      menu.style.left = `${Math.max(12, Math.min(rect.right - menu.offsetWidth, innerWidth - menu.offsetWidth - 12))}px`;
      menu.style.top = `${Math.max(12, Math.min(above ? rect.top - height - 8 : rect.bottom + 8, innerHeight - height - 12))}px`;
    }
    function openMenu(button, record, last = false) {
      clearTimeout(closeTimer);
      if (activeButton) activeButton.setAttribute('aria-expanded', 'false');
      activeButton = button; activeRecord = record; opened = true;
      button.setAttribute('aria-expanded', 'true'); menu.hidden = false; menu.inert = false;
      positionMenu();
      void menu.offsetHeight;
      menu.classList.add('open'); items[last ? items.length - 1 : 0].focus({ preventScroll: true });
    }
    function closeMenu(restore = false) {
      if (!opened) return;
      opened = false; menu.classList.remove('open'); menu.inert = true;
      activeButton?.setAttribute('aria-expanded', 'false');
      if (restore) activeButton?.focus({ preventScroll: true });
      else if (menu.contains(document.activeElement)) document.activeElement.blur();
      closeTimer = setTimeout(() => { if (!opened) menu.hidden = true; }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 160);
    }
    document.addEventListener('pointerdown', event => { if (opened && !menu.contains(event.target) && !activeButton.contains(event.target)) closeMenu(); });
    document.addEventListener('focusin', event => { if (opened && !menu.contains(event.target) && event.target !== activeButton) closeMenu(); });
    document.addEventListener('keydown', event => { if (opened && event.key === 'Escape') { event.preventDefault(); closeMenu(true); } });
    menu.addEventListener('keydown', event => {
      const index = items.indexOf(document.activeElement);
      let next;
      if (event.key === 'ArrowDown') next = (index + 1) % items.length;
      if (event.key === 'ArrowUp') next = (index - 1 + items.length) % items.length;
      if (event.key === 'Home') next = 0;
      if (event.key === 'End') next = items.length - 1;
      if (next !== undefined) { event.preventDefault(); items[next].focus(); }
      if (event.key === 'Tab') { closeMenu(true); }
    });
    window.addEventListener('resize', () => closeMenu(true));
    window.addEventListener('scroll', () => closeMenu(), { passive: true });
    function notify(message) { clearTimeout(toastTimer); document.querySelector('#toast').textContent = message; toastTimer = setTimeout(() => document.querySelector('#toast').textContent = '', 3200); }
    function showDialog(mode, link = '') {
      action = mode;
      const deletion = mode === 'delete';
      document.querySelector('#dialog-title').textContent = { rename: '重命名', move: '移到文件夹', delete: '删除文件', manualCopy: '复制文件链接' }[mode];
      document.querySelector('#description').textContent = deletion ? `确定删除“${activeRecord.name}”吗？本次演示中无法撤销。` : mode === 'manualCopy' ? '浏览器未允许自动复制，请选择链接后手动复制。此链接仅指向本地演示。' : '仅更新本地演示中的文件信息。';
      document.querySelector('#field').hidden = deletion; input.disabled = deletion; input.readOnly = mode === 'manualCopy';
      document.querySelector('#label').textContent = mode === 'rename' ? '文件名称' : mode === 'manualCopy' ? '链接' : '目标文件夹名称';
      input.value = mode === 'rename' ? activeRecord.name : mode === 'manualCopy' ? link : activeRecord.folder;
      document.querySelector('#confirm').textContent = deletion ? '确认删除' : mode === 'manualCopy' ? '完成' : '保存';
      dialog.showModal();
      if (deletion) document.querySelector('#cancel').focus(); else { input.focus(); input.select(); }
    }
    menu.addEventListener('click', async event => {
      const button = event.target.closest('[data-action]'); if (!button) return;
      const mode = button.dataset.action;
      closeMenu(true);
      if (mode !== 'copy') { showDialog(mode); return; }
      const url = new URL(location.href); url.hash = activeRecord.id;
      try { await navigator.clipboard.writeText(url.href); notify('已复制本地演示链接'); }
      catch { showDialog('manualCopy', url.href); }
    });
    document.querySelector('#cancel').addEventListener('click', () => dialog.close());
    dialog.addEventListener('close', () => { if (activeButton?.isConnected) activeButton.focus(); else files.querySelector('button')?.focus(); });
    input.addEventListener('input', () => input.setCustomValidity(''));
    document.querySelector('#form').addEventListener('submit', event => {
      event.preventDefault();
      const value = input.value.trim();
      if (action !== 'delete' && action !== 'manualCopy' && !value) { input.setCustomValidity('请输入非空名称'); input.reportValidity(); return; }
      if (action === 'manualCopy') { dialog.close(); return; }
      const recordId = activeRecord.id;
      if (action === 'rename') activeRecord.name = value;
      if (action === 'move') activeRecord.folder = value;
      if (action === 'delete') records.splice(records.indexOf(activeRecord), 1);
      render(); activeButton = [...files.querySelectorAll('button')].find(button => button.dataset.id === recordId) || files.querySelector('button');
      dialog.close(); notify({ rename: '文件已重命名', move: '已更新目标文件夹', delete: '文件已删除' }[action]);
    });
    render();
  </script>
</body>
</html>
