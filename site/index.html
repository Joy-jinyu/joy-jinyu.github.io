<style>
  :root {
    --bg: #050608; --ink: #eef0f3; --ink-rgb: 238, 240, 243;
    --soft: rgba(var(--ink-rgb), 0.52); --ghost: rgba(var(--ink-rgb), 0.24); --line: rgba(var(--ink-rgb), 0.12);
    --ai: #3ee6d2; --ai-ink: #00231f;
    --you: #f4f4ef; --you-ink: #0b0c0e; --chip: rgba(255, 255, 255, 0.03); --panel: rgba(10, 12, 14, 0.85); --shadow: rgba(0, 0, 0, 0.55);
    --sans: "Geist", "PingFang SC", -apple-system, sans-serif;
    --serif: "Instrument Serif", serif;
    --mono: "Geist Mono", "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  /* 浅色：米白纸面 + 墨色粒子。--ai 比画布 PAL.light.ai 更深，是为了文字 / 链接在米白底上达到 4.5:1；画布上的青色只用于图形 */
  :root[data-theme="light"] {
    --bg: #f6f6f3; --ink: #0d0e11; --ink-rgb: 13, 14, 17;
    --soft: rgba(var(--ink-rgb), 0.62); --ghost: rgba(var(--ink-rgb), 0.26); --line: rgba(var(--ink-rgb), 0.12);
    --ai: #08776d; --ai-ink: #ffffff;
    --you: #0d0e11; --you-ink: #f6f6f3; --chip: rgba(255, 255, 255, 0.6); --panel: rgba(255, 255, 255, 0.92); --shadow: rgba(0, 0, 0, 0.18);
  }
  /* 明暗切换的圆形扩散：关掉默认的交叉淡入，新画面由脚本用 clip-path 从点击处展开 */
  .theme-reveal::view-transition-old(root),
  .theme-reveal::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100svh; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  @media (pointer: fine) { html.own-cursor, html.own-cursor * { cursor: none !important; } }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .sign { position: fixed; left: clamp(20px, 4vw, 56px); bottom: clamp(24px, 4vw, 52px); display: grid; gap: 10px; }
  .sign b { font: 500 clamp(22px, 2.2vw, 28px)/1 var(--sans); letter-spacing: -0.03em; }
  .sign .tag { font: italic 400 clamp(19px, 1.9vw, 24px)/1.2 var(--serif); color: var(--soft); }

  /* 入口是 AI 的补全：交互之前不出现；出现时是灰色衬线斜体，Tab / 点击接受后才变成可点的链接 */
  /* 光标绝对定位在行首，补全整体右移让出光标的位置；接受后滑回行首，和上面两行左对齐 */
  .suggest { position: relative; display: flex; align-items: center; gap: 12px; min-height: 30px; margin-top: 8px; font: italic 400 clamp(19px, 1.9vw, 24px)/1 var(--serif); }
  .caret { position: absolute; left: 0; top: 50%; width: 2px; height: 0.95em; margin-top: -0.475em; border-radius: 1px; background: var(--ai); opacity: 0; }
  .suggest.typing .caret, .suggest.ready .caret { opacity: 1; animation: blink 1.05s steps(1) infinite; }
  .suggest.done .caret { opacity: 0; animation: none; transition: opacity 0.3s; }
  @keyframes blink { 50% { opacity: 0; } }
  .suggest > nav, .suggest > .hint { translate: 10px 0; transition: translate 0.5s var(--ease); }
  .suggest.done > nav { translate: 0 0; }
  nav { display: flex; gap: 0.2em; letter-spacing: -0.01em; }
  /* 打字机：没打到的部分仍在 DOM 里，只是隐藏，排版不跳、搜索引擎能读全文 */
  .tag .rest { visibility: hidden; }
  .tag .tc { display: inline-block; width: 2px; height: 0.9em; margin: 0 1px 0 2px; vertical-align: -0.1em; border-radius: 1px; background: var(--ai); }
  .tag .tc.blink { animation: blink 1.05s steps(1) infinite; }
  .tag .tc.gone { opacity: 0; transition: opacity 0.3s; animation: none; }
  .gh, .theme { position: fixed; right: clamp(20px, 4vw, 56px); bottom: clamp(24px, 4vw, 52px); display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 50%; color: var(--soft); transition: color 0.25s var(--ease), border-color 0.25s var(--ease), background 0.25s var(--ease); }
  .theme { top: clamp(20px, 3.2vw, 40px); bottom: auto; background: none; cursor: pointer; font: inherit; }
  .theme svg { width: 17px; height: 17px; }
  .theme .moon, :root[data-theme="light"] .theme .sun { display: none; }
  :root[data-theme="light"] .theme .moon { display: block; }
  .gh:hover, .gh:focus-visible, .theme:hover, .theme:focus-visible { color: var(--ink); border-color: rgba(var(--ink-rgb), 0.3); background: rgba(var(--ink-rgb), 0.04); outline: none; }
  .gh svg { width: 18px; height: 18px; }
  nav a {
    position: relative; padding: 2px 0; color: transparent;
    background: linear-gradient(90deg, var(--ai) 0 var(--p, 0%), var(--ghost) var(--p, 0%) 100%);
    -webkit-background-clip: text; background-clip: text;
    opacity: 0; filter: blur(8px); transform: translateX(-6px);
    transition: opacity 0.5s var(--ease), filter 0.5s var(--ease), transform 0.5s var(--ease);
    transition-delay: calc(var(--i) * 70ms);
  }
  nav a + a::before { content: "·"; margin-right: 0.2em; color: var(--ghost); -webkit-text-fill-color: var(--ghost); }
  .suggest.ready nav a, .suggest.done nav a { opacity: 1; filter: none; transform: none; }
  .suggest:not(.done) nav a { cursor: pointer; }
  .suggest.done nav a::after { content: ""; position: absolute; left: 0; right: 100%; bottom: -2px; height: 1px; background: var(--ai); transition: right 0.35s var(--ease); }
  .suggest.done nav a:hover::after, .suggest.done nav a:focus-visible::after { right: 0; }
  .suggest.done nav a:focus-visible { outline: none; }
  .hint {
    display: inline-flex; align-items: center; gap: 8px; padding: 5px 6px 5px 10px; border: 1px solid var(--line); border-radius: 999px;
    font: 400 11px/1 var(--mono); letter-spacing: 0.02em; color: var(--soft); background: var(--chip); backdrop-filter: blur(8px);
    opacity: 0; transform: translateX(-4px); transition: opacity 0.4s var(--ease) 0.3s, transform 0.4s var(--ease) 0.3s; pointer-events: none;
  }
  .hint kbd { padding: 3px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; color: var(--ink); font: 500 10px/1 var(--mono); }
  .suggest.ready .hint { opacity: 1; transform: none; pointer-events: auto; cursor: pointer; }
  .suggest.done .hint { opacity: 0; transition-delay: 0s; }
  @media (hover: none) { .hint kbd { display: none; } }

  /* 两个光标：Joy 是访客的指针，AI 跟着它结对 */
  .cursor { position: fixed; left: 0; top: 0; z-index: 10; pointer-events: none; will-change: transform; opacity: 0; transition: opacity 0.3s var(--ease); }
  .cursor.on { opacity: 1; }
  /* 访客一动 AI 就要立刻不见：只淡入，不淡出 */
  .cursor.ai:not(.on) { transition: none; }
  .cursor svg { display: block; width: 17px; height: 17px; overflow: visible; filter: drop-shadow(0 3px 8px var(--shadow)); transform-origin: 2px 2px; transition: transform 0.2s var(--ease); }
  .cursor b { position: absolute; left: 13px; top: 15px; padding: 4px 8px 5px; border-radius: 3px 999px 999px 999px; font: 500 11px/1 var(--sans); letter-spacing: 0.01em; white-space: nowrap; transition: transform 0.25s var(--ease); transform-origin: 0 0; }
  .cursor.you b { background: var(--you); color: var(--you-ink); }
  .cursor.you path { fill: var(--you); stroke: var(--you-ink); }
  .cursor.ai path { fill: var(--ai); stroke: var(--ai-ink); }
  .cursor.ai b { background: var(--ai); color: var(--ai-ink); }
  .cursor.you.press svg { transform: scale(0.86); }
  .cursor.you.link b { transform: scale(1.08); }
  .cursor .say { position: absolute; left: 44px; top: 14px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--soft); font: 400 10.5px/1 var(--mono); white-space: nowrap; opacity: 0; transform: translateX(-4px); transition: opacity 0.3s var(--ease), transform 0.3s var(--ease); }
  .cursor .say.on { opacity: 1; transform: none; }
  @media (max-width: 640px) { .sign { right: 76px; } .suggest { flex-wrap: wrap; } }
</style>
</head>

<div class="cursor ai" id="ai"><svg viewBox="0 0 17 17"><path d="M2 1.6 15 7.8 8.9 9.4 6.6 15.4z" fill="#3ee6d2" stroke="#00231f" stroke-width="1.1" stroke-linejoin="round"/></svg><b>AI</b><span class="say" id="say"></span></div>
<script>
  const cv = document.getElementById('c'), ctx = cv.getContext('2d')
  const youEl = document.getElementById('you'), aiEl = document.getElementById('ai'), say = document.getElementById('say')
  const suggest = document.getElementById('suggest'), nav = document.getElementById('nav'), hint = document.getElementById('hint')
  const links = [...nav.querySelectorAll('a')]
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  const fine = matchMedia('(pointer: fine)').matches
  let W, H, dpr, P = [], step, t0, wordBox = { x: 0, y: 0, w: 0, h: 0 }
  // 画布颜色，和 CSS 的 :root / [data-theme="light"] 对应；浅色下粒子用深墨色、高不透明度，否则在米白底上发灰
  const PAL = {
    dark: { bg: '#050608', dot: '238,240,243', dotA: 0.9, ai: '62,230,210', you: '244,244,239', glow: '215,235,240', cool: '120,200,255' },
    light: { bg: '#f6f6f3', dot: '13,14,17', dotA: 0.88, ai: '10,156,144', you: '13,14,17', glow: '255,255,255', cool: '20,110,150' },
  }
  const pal = () => PAL[document.documentElement.dataset.theme === 'light' ? 'light' : 'dark']

  // 平滑值噪声，给风吹散的湍流用
  const PERM = Array.from({ length: 512 }, (_, i) => i % 256).sort(() => Math.random() - 0.5)
  const rnd = (x, y) => PERM[(PERM[x & 255] + y) & 511] / 255
  function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf)
    const a = rnd(xi, yi), b = rnd(xi + 1, yi), c = rnd(xi, yi + 1), d = rnd(xi + 1, yi + 1)
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v
  }
  const fbm = (x, y, t) => noise(x + t, y - t * 0.7) * 0.65 + noise(x * 2.1 - t * 0.5, y * 2.1 + t) * 0.35

  /*
   * 相机：字在 z=0 的竖直平面上（z 朝屏幕里为正），镜头绕字中心极慢地小幅环绕，鼠标带一点视差。
   * 粒子物理都在字的平面里算，画的时候投影到屏幕；鼠标 / AI 光标的位置反投影回平面再参与交互
   */
  const camS = { yaw: 0, pitch: 0, F: 650, ox: 0, oy: 0, m: null }
  function updateCam(t, dt) {
    const k = reduce ? 0 : t
    let ty = Math.sin(k * 0.00011) * 0.42, tp = -0.18 + Math.sin(k * 0.00007) * 0.16
    if (you.live && !reduce) { ty += (you.x / W - 0.5) * 0.08; tp += (you.y / H - 0.5) * 0.06 }
    const e = reduce || !camS.m ? 1 : 1 - Math.pow(0.04, dt)
    camS.yaw += (ty - camS.yaw) * e; camS.pitch += (tp - camS.pitch) * e
    const cy = Math.cos(camS.yaw), sy = Math.sin(camS.yaw), cp = Math.cos(camS.pitch), sp = Math.sin(camS.pitch)
    camS.m = [cy, 0, sy, sp * sy, cp, -sp * cy, -cp * sy, sp, cp * cy]
    camS.ox = wordBox.x + wordBox.w / 2; camS.oy = wordBox.y + wordBox.h / 2
  }
  function toS(x, y, z = 0) {
    const m = camS.m, X = x - camS.ox, Y = y - camS.oy
    const cx = m[0] * X + m[1] * Y + m[2] * z, cyy = m[3] * X + m[4] * Y + m[5] * z, cz = m[6] * X + m[7] * Y + m[8] * z
    const s = camS.F / Math.max(80, camS.F + cz)
    return { x: camS.ox + cx * s, y: camS.oy + cyy * s, s, z: cz }
  }
  function toP(sx, sy) {
    const m = camS.m, a = sx - camS.ox, b = sy - camS.oy, F = camS.F
    const A1 = a * m[6] - F * m[0], B1 = a * m[7] - F * m[1], A2 = b * m[6] - F * m[3], B2 = b * m[7] - F * m[4], det = A1 * B2 - A2 * B1
    if (Math.abs(det) < 1e-6) return null
    const u = (-a * F * B2 + b * F * B1) / det, v = (-b * F * A1 + a * F * A2) / det
    // 超宽屏上屏幕点可能在地平线之外，反投影会落到相机背后，这时这个点不参与交互
    if (camS.F + m[6] * u + m[7] * v <= 0) return null
    return { x: camS.ox + u, y: camS.oy + v }
  }

  // 三点布光（主光左上、冷色补光右侧、背光在字后），以字中心为原点；粒子按到各光源的距离取亮度
  function lights(C0) {
    const w = wordBox.w, h = wordBox.h
    return [
      { x: -w * 0.45, y: -h * 1.0, z: -300, r: w * 0.5, c: C0.glow, glow: 0.12, gr: 0.4 },
      { x: w * 0.6, y: -h * 0.2, z: -380, r: w * 0.45, c: C0.cool, glow: 0.05, gr: 0.3 },
      { x: 0, y: -h * 0.4, z: 320, r: w * 0.35, c: C0.glow, glow: 0.12, gr: 0.45 },
    ]
  }
  function lit(p, LT) {
    let sum = 0
    const X = p.x - camS.ox, Y = p.y - camS.oy
    for (const L of LT) sum += 1 / (1 + ((X - L.x) ** 2 + (Y - L.y) ** 2 + L.z ** 2 * 0.35) / (L.r * L.r))
    // 1.05 / 0.5 来自实测：三盏灯在字上的叠加值落在 1.10~1.55，映射到 0~1 才有明暗，直接截断会全部饱和成一样亮
    return Math.max(0, Math.min(1, (sum - 1.05) / 0.5))
  }
  function drawLightGlow(LT, C0) {
    const light = C0 === PAL.light
    // 深色下光晕用加色混合才像在发光；浅色下用白色高光，再压一圈极淡的暗角托出层次
    ctx.globalCompositeOperation = light ? 'source-over' : 'lighter'
    for (const L of LT) {
      const c = toS(camS.ox + L.x, camS.oy + L.y, L.z), r = wordBox.w * L.gr * c.s
      const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r)
      g.addColorStop(0, `rgba(${L.c},${light ? L.glow * 4 : L.glow})`); g.addColorStop(1, `rgba(${L.c},0)`)
      ctx.fillStyle = g; ctx.fillRect(c.x - r, c.y - r, r * 2, r * 2)
    }
    ctx.globalCompositeOperation = 'source-over'
    if (light) {
      const v = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.3, W / 2, H * 0.45, Math.max(W, H) * 0.75)
      v.addColorStop(0, 'rgba(13,14,17,0)'); v.addColorStop(1, 'rgba(13,14,17,0.05)')
      ctx.fillStyle = v; ctx.fillRect(0, 0, W, H)
    }
  }

  /*
   * 空间：字前后不同深度的浮尘，加上离镜头最近的一层虚化光斑（前景虚焦），镜头一动就有纵深。
   * 都是低对比度的装饰，不能比字显眼
   */
  let dust = [], bokeh = []
  function initSpace() {
    dust = Array.from({ length: 150 }, () => ({ x: (Math.random() - 0.5) * W * 2.2, y: (Math.random() - 0.5) * H * 1.6, z: -450 + Math.random() * 1900, ph: Math.random() * 6.28 }))
    bokeh = Array.from({ length: 14 }, () => ({ x: (Math.random() - 0.5) * W * 1.4, y: (Math.random() - 0.5) * H * 1.2, z: -420 - Math.random() * 120, r: 10 + Math.random() * 26, ph: Math.random() * 6.28 }))
  }
  function drawSpace(t, C0, front) {
    const light = C0 === PAL.light, k = reduce ? 0 : t / 1000
    for (const d of dust) {
      if ((d.z < 0) !== front) continue
      const p = toS(camS.ox + d.x + Math.sin(k * 0.1 + d.ph) * 20, camS.oy + d.y + Math.cos(k * 0.08 + d.ph) * 14, d.z)
      if (p.z < -camS.F + 100) continue
      const s = 1.4 * p.s, a = (d.z < 0 ? 0.2 : 0.3) * Math.min(1, p.s) * (0.6 + 0.4 * Math.sin(k + d.ph)) * (light ? 1.4 : 1)
      ctx.fillStyle = `rgba(${C0.dot},${a})`; ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s)
    }
    if (!front) return
    for (const b of bokeh) {
      const p = toS(camS.ox + b.x + Math.sin(k * 0.07 + b.ph) * 30, camS.oy + b.y + Math.cos(k * 0.05 + b.ph) * 20, b.z)
      if (p.z < -camS.F + 100) continue
      const r = b.r * p.s, a = (light ? 0.05 : 0.045) * (0.7 + 0.3 * Math.sin(k * 0.4 + b.ph))
      const g = ctx.createRadialGradient(p.x, p.y, r * 0.2, p.x, p.y, r)
      g.addColorStop(0, `rgba(${b.ph > 4.5 ? C0.ai : C0.dot},${a})`); g.addColorStop(1, `rgba(${C0.dot},0)`)
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283); ctx.fill()
    }
  }

  /* ---------- 粒子：「Pairwise」由 token 组成 ---------- */
  function sample() {
    dpr = Math.min(2, devicePixelRatio || 1)
    W = innerWidth; H = innerHeight
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    const size = Math.min(W * (W < 640 ? 0.235 : 0.17), H * 0.34, 260), cy = H * (W < 640 ? 0.4 : 0.44)
    const off = document.createElement('canvas'), o = off.getContext('2d')
    off.width = W; off.height = H
    o.font = `620 ${size}px Geist`; o.letterSpacing = `${-size * 0.055}px`
    o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#fff'
    o.fillText('Pairwise', W / 2, cy)
    const tw = o.measureText('Pairwise').width
    wordBox = { x: W / 2 - tw / 2, y: cy - size * 0.4, w: tw, h: size * 0.8 }
    const data = o.getImageData(0, 0, W, H).data
    step = Math.max(3, Math.round(size / 46))
    const pts = []
    for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
      if (data[(y * W + x) * 4 + 3] > 128) pts.push([x + (Math.random() - 0.5) * step * 0.6, y + (Math.random() - 0.5) * step * 0.6])
    }
    P = pts.map(([hx, hy]) => ({
      hx, hy, x: -Math.random() * W * 0.4, y: hy + (Math.random() - 0.5) * 80, vx: 0, vy: 0,
      r: Math.random() < 0.12 ? 1.6 : 0.6 + Math.random() * 0.8, ph: Math.random() * 6.28,
      delay: (hx / W) * 900 + Math.random() * 500, nb: -1, q: -1, heat: 0, d: 0,
    }))
    // 每个粒子记一个最近邻，查询点经过时把这些成对关系画出来
    const cell = step * 3, grid = new Map(), key = (x, y) => `${Math.floor(x / cell)},${Math.floor(y / cell)}`
    P.forEach((p, i) => { const k = key(p.hx, p.hy); (grid.get(k) || grid.set(k, []).get(k)).push(i) })
    P.forEach((p, i) => {
      const cx = Math.floor(p.hx / cell), cy2 = Math.floor(p.hy / cell); let best = 1e9
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (const j of grid.get(`${cx + dx},${cy2 + dy}`) || []) {
        if (j === i) continue
        const d = (P[j].hx - p.hx) ** 2 + (P[j].hy - p.hy) ** 2
        if (d < best && d > step * step * 2) { best = d; p.nb = j }
      }
    })
    t0 = performance.now()
    if (reduce) P.forEach((p) => { p.x = p.hx; p.y = p.hy })
    initSpace()
  }
  /* ---------- 光标 ---------- */
  const you = { x: -100, y: -100, live: false, last: -1e9 }
  const ai = { x: innerWidth * 0.5, y: innerHeight + 60, vx: 0, vy: 0, tx: 0, ty: 0, mode: 'wander', show: true, a: 1 }

  addEventListener('pointermove', (e) => {
    const now = performance.now()
    you.x = e.clientX; you.y = e.clientY; you.last = now
    if (e.pointerType === 'mouse') { you.live = true; youEl.classList.add('on'); document.documentElement.classList.add('own-cursor') }
    youEl.style.transform = `translate3d(${you.x - 2}px, ${you.y - 2}px, 0)`
    youEl.classList.toggle('link', !!e.target.closest('a, .hint, button'))
    wake()
  })
  addEventListener('pointerdown', (e) => {
    youEl.classList.add('press'); wake()
    if (e.pointerType !== 'mouse') { you.x = e.clientX; you.y = e.clientY; you.last = performance.now() }
    // 点空白处：像一阵风从点击处吹过，粒子顺着湍流飘散，再从左到右一个字母一个字母地落回；点链接、按钮时不吹
    if (!e.target.closest('a, .hint, button') && !reduce) burst(e.clientX, e.clientY)
  })
  function burst(sx, sy) {
    const c = camS.m && toP(sx, sy)
    if (!c) return
    const now = performance.now()
    for (const p of P) {
      const ex = p.x - c.x, ey = p.y - c.y, e = Math.hypot(ex, ey) || 1, m = 10 + 18 * Math.exp(-e / 380)
      p.vx += (ex / e) * m * (0.6 + Math.random() * 0.8); p.vy += (ey / e) * m * 0.6 * (0.6 + Math.random() * 0.8) - 2
      p.back = now + 900 + ((p.hx - wordBox.x) / wordBox.w) * 1500
    }
  }
  addEventListener('pointerup', () => youEl.classList.remove('press'))
  document.documentElement.addEventListener('pointerleave', () => { you.live = false; youEl.classList.remove('on') })

  /* ---------- 入口：交互后 AI 写出补全，接受后才是链接 ---------- */
  let woke = false, accepted = false
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
  function caretPoint() { const r = suggest.getBoundingClientRect(); return { x: r.left + 4, y: r.top + r.height / 2 } }
  async function wake() {
    if (woke) return
    woke = true
    await typed
    await sleep(reduce ? 0 : 450)
    ai.mode = 'suggest'
    // AI 光标在场时先飞到补全的位置再开始写，最多等 1.4 秒；访客正在动鼠标时 AI 不出现，直接写
    for (let t = 0; t < 1400 && !reduce && ai.show; t += 50) { const c = caretPoint(); if (Math.hypot(ai.x - c.x, ai.y - c.y) < 36) break; await sleep(50) }
    say.textContent = 'suggesting…'; say.classList.add('on')
    suggest.classList.add('typing')
    await sleep(reduce ? 0 : 700)
    suggest.classList.remove('typing'); suggest.classList.add('ready')
    say.textContent = fine ? 'Tab to accept' : 'tap to accept'
    await sleep(1300)
    say.classList.remove('on')
    if (ai.mode === 'suggest') ai.mode = 'wander'
  }
  function accept(go) {
    if (accepted || !suggest.classList.contains('ready')) return
    accepted = true
    const t1 = performance.now(), dur = reduce ? 1 : 520
    const tick = (t) => {
      const k = Math.min(1, (t - t1) / dur)
      links.forEach((a, i) => a.style.setProperty('--p', Math.max(0, Math.min(1, k * 1.6 - i * 0.3)) * 100 + '%'))
      if (k < 1) return requestAnimationFrame(tick)
      suggest.classList.replace('ready', 'done')
      links.forEach((a) => { a.style.background = 'none'; a.style.color = 'var(--ai)'; a.removeAttribute('tabindex') })
      if (go) location.href = go
    }
    requestAnimationFrame(tick)
    say.classList.remove('on')
  }
  addEventListener('keydown', (e) => {
    wake()
    if (e.key === 'Tab' && !accepted && suggest.classList.contains('ready')) { e.preventDefault(); accept(); setTimeout(() => links[0].focus(), 560) }
  })
  hint.addEventListener('click', () => accept())
  links.forEach((a) => a.addEventListener('click', (e) => { if (!accepted) { e.preventDefault(); accept(a.href) } }))

  /* ---------- 明暗切换：新主题从点击处圆形扩散铺满全屏（同 resume/index.html） ---------- */
  const themeBtn = document.getElementById('theme')
  function applyTheme(next) {
    document.documentElement.dataset.theme = next
    syncChrome()
    try { localStorage.setItem('starlight-theme', next) } catch (e) {}
    const u = new URL(location.href)
    if (u.searchParams.has('theme')) { u.searchParams.delete('theme'); history.replaceState(history.state, '', u) }
  }
  // 地址栏颜色和按钮的读屏文案跟着当前主题走
  function syncChrome() {
    const light = document.documentElement.dataset.theme === 'light'
    document.querySelector('meta[name="theme-color"]').content = light ? '#f6f6f3' : '#050608'
    themeBtn.setAttribute('aria-label', light ? '切换到深色' : '切换到浅色')
  }
  syncChrome()
  themeBtn.addEventListener('click', (e) => {
    const root = document.documentElement, next = root.dataset.theme === 'light' ? 'dark' : 'light'
    if (!document.startViewTransition || reduce) return applyTheme(next)
    const r = themeBtn.getBoundingClientRect()
    const x = e.detail ? e.clientX : r.left + r.width / 2, y = e.detail ? e.clientY : r.top + r.height / 2
    const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y))
    root.classList.add('theme-reveal')
    const t = document.startViewTransition(() => applyTheme(next))
    t.ready.then(() => root.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`] },
      { duration: 500, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', pseudoElement: '::view-transition-new(root)' })).catch(() => {})
    t.finished.finally(() => root.classList.remove('theme-reveal'))
  })

  // 静止粒子最多，颜色串每帧现拼会产生几千个临时字符串；亮度量化成 21 档后复用
  const colorCache = new Map()
  function restColor(C0, a) {
    const key = C0.dot + Math.round(a * 20)
    let c = colorCache.get(key)
    if (!c) colorCache.set(key, (c = `rgba(${C0.dot},${Math.round(a * 20) / 20})`))
    return c
  }

  /* ---------- 每帧 ---------- */
  let prev = performance.now()
  function frame(t) {
    const dt = Math.min(0.05, (t - prev) / 1000); prev = t
    const el = t - t0
    // AI 光标只在访客静止约 2 秒后出现（从访客光标旁边淡入，再去字上巡游），访客一动就立刻消失（光圈、虚线一起，不留淡出）
    const idle = t - you.last > 2200
    if (idle && !ai.show) {
      ai.show = true; ai.since = t; aiEl.classList.add('on')
      if (you.live) { ai.x = you.x + 42; ai.y = you.y + 30; ai.vx = ai.vy = 0 }
    } else if (!idle && ai.show) { ai.show = false; ai.a = 0; aiEl.classList.remove('on') }
    ai.a += ((ai.show ? 1 : 0) - ai.a) * Math.min(1, dt * 6)

    // AI 的目标：写补全时停在补全行首的左下方（标签和气泡往下展开，不挡补全文字）；刚出现时先在访客旁边停一下；其余时间在字上巡游
    const fresh = you.live ? t - (ai.since || -1e9) : 1e9
    if (ai.mode === 'suggest' && ai.show) { const c = caretPoint(); ai.tx = c.x - 4; ai.ty = c.y + 16 }
    else if (fresh < 900) { ai.tx = you.x + 42; ai.ty = you.y + 30 }
    else {
      if (ai.mode !== 'suggest') ai.mode = 'wander'
      const k = reduce ? 0 : el / 1000
      const wt = camS.m ? toS(wordBox.x + wordBox.w * (0.5 + Math.sin(k * 0.37) * 0.46), wordBox.y + wordBox.h * (0.5 + Math.sin(k * 0.83 + 1) * 0.42)) : { x: W / 2, y: H / 2 }
      ai.tx = wt.x; ai.ty = wt.y
    }
    // 略欠阻尼的弹簧：有一点惯性和过冲，像另一个人在操作
    // 刚离开访客时弹簧放软，慢慢飘向字，不要一下冲过去
    const K = ai.mode === 'suggest' ? 70 : fresh < 2500 ? 10 : 34, C = 2 * Math.sqrt(K) * 0.82
    ai.vx += ((ai.tx - ai.x) * K - ai.vx * C) * dt
    ai.vy += ((ai.ty - ai.y) * K - ai.vy * C) * dt
    ai.x += ai.vx * dt; ai.y += ai.vy * dt
    const tilt = Math.max(-14, Math.min(14, ai.vx * 0.02))
    aiEl.style.transform = `translate3d(${ai.x - 2}px, ${ai.y - 2}px, 0)`
    aiEl.firstElementChild.style.transform = `rotate(${tilt}deg)`

    const C0 = pal()
    updateCam(t, dt)
    ctx.fillStyle = C0.bg; ctx.fillRect(0, 0, W, H)
    const LT = lights(C0)
    drawLightGlow(LT, C0)
    drawSpace(t, C0, false)
    // 交互点反投影到字的平面：物理在平面里算，连线从屏幕上的光标画出去
    const Q = [], qa = toP(ai.x, ai.y)
    if (qa && ai.a > 0.02) Q.push({ x: qa.x, y: qa.y, sx: ai.x, sy: ai.y, c: C0.ai, R: Math.min(190, W * 0.22) * ai.a })
    if (you.live || (!fine && t - you.last < 1500)) { const qy = toP(you.x, you.y); if (qy) Q.push({ x: qy.x, y: qy.y, sx: you.x, sy: you.y, c: C0.you, R: Math.min(170, W * 0.2) }) }

    for (const p of P) {
      if (el > p.delay || reduce) {
        const jx = reduce ? 0 : Math.sin(el * 0.0011 + p.ph) * 0.9, jy = reduce ? 0 : Math.cos(el * 0.0013 + p.ph) * 0.9
        const free = p.back > t
        const kS = free ? 0 : 0.06, damp = free ? 0.95 : 0.82
        let ax = (p.hx + jx - p.x) * kS, ay = (p.hy + jy - p.y) * kS
        if (free) { const a = fbm(p.x * 0.004, p.y * 0.004, t * 0.0004) * Math.PI * 4; ax += Math.cos(a) * 0.55 + 0.25; ay += Math.sin(a) * 0.55 - 0.08 }
        p.q = -1; p.heat = 0
        for (let qi = 0; qi < Q.length; qi++) {
          const q = Q[qi], dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy
          if (d2 < q.R * q.R) {
            const d = Math.sqrt(d2) || 1, f = (1 - d / q.R) ** 2
            ax += (dx / d) * f * 2; ay += (dy / d) * f * 2
            if (1 - d / q.R > p.heat) { p.heat = 1 - d / q.R; p.q = qi; p.d = d }
          }
        }
        p.vx = (p.vx + ax) * damp; p.vy = (p.vy + ay) * damp
        p.x += p.vx; p.y += p.vy
      } else p.x += 6
    }

    for (const p of P) { const pr = toS(p.x, p.y); p.px = pr.x; p.py = pr.y; p.ps = pr.s }

    // 成对连线 + 注意力线
    const settled = (p) => Math.abs(p.x - p.hx) + Math.abs(p.y - p.hy) < step * 6
    ctx.lineWidth = 0.6
    const byQ = Q.map(() => [])
    for (const p of P) if (p.q >= 0 && settled(p)) {
      byQ[p.q].push(p)
      const n = P[p.nb]
      if (n && settled(n)) { ctx.strokeStyle = `rgba(${Q[p.q].c},${p.heat * 0.5})`; ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(n.px, n.py); ctx.stroke() }
    }
    ctx.lineWidth = 0.5
    byQ.forEach((arr, qi) => {
      arr.sort((a, b) => a.d - b.d)
      for (const p of arr.slice(0, 24)) { ctx.strokeStyle = `rgba(${Q[qi].c},${p.heat ** 1.5 * 0.32})`; ctx.beginPath(); ctx.moveTo(Q[qi].sx, Q[qi].sy); ctx.lineTo(p.px, p.py); ctx.stroke() }
    })
    // 两个光标之间的那一根线：Pairwise 的「一对」
    if (Q.length > 1 && Q[0].c === C0.ai) {
      const g = ctx.createLinearGradient(Q[1].sx, Q[1].sy, Q[0].sx, Q[0].sy)
      g.addColorStop(0, `rgba(${C0.you},0.35)`); g.addColorStop(1, `rgba(${C0.ai},0.5)`)
      ctx.strokeStyle = g; ctx.lineWidth = 0.8; ctx.setLineDash([2, 4])
      ctx.beginPath(); ctx.moveTo(Q[1].sx, Q[1].sy); ctx.lineTo(Q[0].sx, Q[0].sy); ctx.stroke(); ctx.setLineDash([])
    }
    // 粒子：投影到屏幕，亮度看受光（最暗也留一半多，字要始终是焦点）；被风吹着的粒子带一点青色。
    // 尺寸下限 1px：镜头转开时远侧粒子会缩到亚像素、被抗锯齿冲淡；浅色底上同理，整体放大 1.25 倍
    const light = C0 === PAL.light
    for (const p of P) {
      const flying = p.back > t ? Math.min(1, (p.back - t) / 600) : 0
      const la = light ? 0.6 + lit(p, LT) * 0.45 : 0.55 + lit(p, LT) * 0.5, s = Math.max(1, (p.r + p.heat * 1.2) * p.ps * (light ? 1.25 : 1))
      ctx.fillStyle = p.heat > 0.04 ? `rgba(${Q[p.q].c},${0.45 + p.heat * 0.55})`
        : flying > 0.05 ? `rgba(${C0.ai},${(0.35 + flying * 0.45) * Math.max(0.5, la)})`
        : restColor(C0, Math.min(1, C0.dotA * la))
      ctx.fillRect(p.px - s / 2, p.py - s / 2, s, s)
    }
    drawSpace(t, C0, true)
    requestAnimationFrame(frame)
  }

  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(sample, 150) })
  // 「Joy」下面那行逐字打出来；整句一直在 DOM 里，没打到的部分隐藏
  const tagEl = document.getElementById('tag'), full = tagEl.textContent
  let typedDone
  const typed = new Promise((r) => (typedDone = r))
  async function typewriter() {
    if (reduce) return typedDone()
    tagEl.innerHTML = '<span class="done"></span><i class="tc" aria-hidden="true"></i><span class="rest"></span>'
    tagEl.setAttribute('aria-label', full)
    const [done, tc, rest] = tagEl.children
    rest.textContent = full
    await sleep(1100)
    for (let n = 1; n <= full.length; n++) {
      done.textContent = full.slice(0, n); rest.textContent = full.slice(n)
      const ch = full[n - 1]
      await sleep(ch === ' ' ? 70 : /[&,.]/.test(ch) ? 180 : 32 + Math.random() * 46)
    }
    tc.classList.add('blink'); await sleep(1600)
    tc.classList.add('gone'); typedDone()
    await sleep(320)
    tagEl.textContent = full; tagEl.removeAttribute('aria-label')
  }

  document.fonts.load('620 100px Geist').then(() => {
    typewriter()
    sample(); aiEl.classList.add('on'); requestAnimationFrame(frame)
  })
</script>
</body>
</html>
