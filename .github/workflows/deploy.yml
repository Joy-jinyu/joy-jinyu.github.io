# master 有新提交就构建并发布到 gh-page；构建步骤只在 deploy-gh.sh 里维护一份
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 推送走 DEPLOY_REMOTE，不需要把 token 留在 .git/config 里给依赖的安装脚本看见
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      # 投稿编辑器用 NSH 打包；版本和本机一致，升级时两边一起改（scripts/package-editor.sh）
      - name: 安装 nsh
        env:
          NSH_VERSION: v0.6.0
        run: |
          curl -fsSL "https://raw.githubusercontent.com/longbridge/nsh/$NSH_VERSION/website/public/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nsh" component add web
      - name: 构建并推送 gh-page
        env:
          DEPLOY_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash deploy-gh.sh
