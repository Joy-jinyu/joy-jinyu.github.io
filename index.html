<style>
  :root {
    --bg: #050608; --ink: #eef0f3; --ink-rgb: 238, 240, 243;
    --soft: rgba(var(--ink-rgb), 0.52); --ghost: rgba(var(--ink-rgb), 0.24); --line: rgba(var(--ink-rgb), 0.12);
    --ai: #3ee6d2; --ai-ink: #00231f;
    --sans: "Geist", "PingFang SC", -apple-system, sans-serif;
    --serif: "Instrument Serif", serif;
    --mono: "Geist Mono", "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100svh; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  @media (pointer: fine) { html.own-cursor, html.own-cursor * { cursor: none !important; } }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .sign { position: fixed; left: clamp(20px, 4vw, 56px); bottom: clamp(24px, 4vw, 52px); display: grid; gap: 10px; }
  .sign b { font: 500 clamp(22px, 2.2vw, 28px)/1 var(--sans); letter-spacing: -0.03em; }
  .sign .tag { font: italic 400 clamp(19px, 1.9vw, 24px)/1.2 var(--serif); color: var(--soft); }

  /* 入口是 AI 的补全：交互之前不出现；出现时是灰色衬线斜体，Tab / 点击接受后才变成可点的链接 */
  /* 光标绝对定位在行首，补全整体右移让出光标的位置；接受后滑回行首，和上面两行左对齐 */
  .suggest { position: relative; display: flex; align-items: center; gap: 12px; min-height: 30px; margin-top: 8px; font: italic 400 clamp(19px, 1.9vw, 24px)/1 var(--serif); }
  .caret { position: absolute; left: 0; top: 50%; width: 2px; height: 0.95em; margin-top: -0.475em; border-radius: 1px; background: var(--ai); opacity: 0; }
  .suggest.typing .caret, .suggest.ready .caret { opacity: 1; animation: blink 1.05s steps(1) infinite; }
  .suggest.done .caret { opacity: 0; animation: none; transition: opacity 0.3s; }
  @keyframes blink { 50% { opacity: 0; } }
  .suggest > nav, .suggest > .hint { translate: 10px 0; transition: translate 0.5s var(--ease); }
  .suggest.done > nav { translate: 0 0; }
  nav { display: flex; gap: 0.2em; letter-spacing: -0.01em; }
  /* 打字机：没打到的部分仍在 DOM 里，只是隐藏，排版不跳、搜索引擎能读全文 */
  .tag .rest { visibility: hidden; }
  .tag .tc { display: inline-block; width: 2px; height: 0.9em; margin: 0 1px 0 2px; vertical-align: -0.1em; border-radius: 1px; background: var(--ai); }
  .tag .tc.blink { animation: blink 1.05s steps(1) infinite; }
  .tag .tc.gone { opacity: 0; transition: opacity 0.3s; animation: none; }
  .gh { position: fixed; right: clamp(20px, 4vw, 56px); bottom: clamp(24px, 4vw, 52px); display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 50%; color: var(--soft); transition: color 0.25s var(--ease), border-color 0.25s var(--ease), background 0.25s var(--ease); }
  .gh:hover, .gh:focus-visible { color: var(--ink); border-color: rgba(var(--ink-rgb), 0.3); background: rgba(var(--ink-rgb), 0.04); outline: none; }
  .gh svg { width: 18px; height: 18px; }
  nav a {
    position: relative; padding: 2px 0; color: transparent;
    background: linear-gradient(90deg, var(--ai) 0 var(--p, 0%), var(--ghost) var(--p, 0%) 100%);
    -webkit-background-clip: text; background-clip: text;
    opacity: 0; filter: blur(8px); transform: translateX(-6px);
    transition: opacity 0.5s var(--ease), filter 0.5s var(--ease), transform 0.5s var(--ease);
    transition-delay: calc(var(--i) * 70ms);
  }
  nav a + a::before { content: "·"; margin-right: 0.2em; color: var(--ghost); -webkit-text-fill-color: var(--ghost); }
  .suggest.ready nav a, .suggest.done nav a { opacity: 1; filter: none; transform: none; }
  .suggest:not(.done) nav a { cursor: pointer; }
  .suggest.done nav a::after { content: ""; position: absolute; left: 0; right: 100%; bottom: -2px; height: 1px; background: var(--ai); transition: right 0.35s var(--ease); }
  .suggest.done nav a:hover::after, .suggest.done nav a:focus-visible::after { right: 0; }
  .suggest.done nav a:focus-visible { outline: none; }
  .hint {
    display: inline-flex; align-items: center; gap: 8px; padding: 5px 6px 5px 10px; border: 1px solid var(--line); border-radius: 999px;
    font: 400 11px/1 var(--mono); letter-spacing: 0.02em; color: var(--soft); background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(8px);
    opacity: 0; transform: translateX(-4px); transition: opacity 0.4s var(--ease) 0.3s, transform 0.4s var(--ease) 0.3s; pointer-events: none;
  }
  .hint kbd { padding: 3px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; color: var(--ink); font: 500 10px/1 var(--mono); }
  .suggest.ready .hint { opacity: 1; transform: none; pointer-events: auto; cursor: pointer; }
  .suggest.done .hint { opacity: 0; transition-delay: 0s; }
  @media (hover: none) { .hint kbd { display: none; } }

  /* 两个光标：Joy 是访客的指针，AI 跟着它结对 */
  .cursor { position: fixed; left: 0; top: 0; z-index: 10; pointer-events: none; will-change: transform; opacity: 0; transition: opacity 0.3s var(--ease); }
  .cursor.on { opacity: 1; }
  .cursor svg { display: block; width: 17px; height: 17px; overflow: visible; filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.55)); transform-origin: 2px 2px; transition: transform 0.2s var(--ease); }
  .cursor b { position: absolute; left: 13px; top: 15px; padding: 4px 8px 5px; border-radius: 3px 999px 999px 999px; font: 500 11px/1 var(--sans); letter-spacing: 0.01em; white-space: nowrap; transition: transform 0.25s var(--ease); transform-origin: 0 0; }
  .cursor.you b { background: #f4f4ef; color: #0b0c0e; }
  .cursor.ai b { background: var(--ai); color: var(--ai-ink); }
  .cursor.you.press svg { transform: scale(0.86); }
  .cursor.you.link b { transform: scale(1.08); }
  .cursor .say { position: absolute; left: 44px; top: 14px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: rgba(10, 12, 14, 0.85); color: var(--soft); font: 400 10.5px/1 var(--mono); white-space: nowrap; opacity: 0; transform: translateX(-4px); transition: opacity 0.3s var(--ease), transform 0.3s var(--ease); }
  .cursor .say.on { opacity: 1; transform: none; }
  @media (max-width: 640px) { .sign { right: 76px; } .suggest { flex-wrap: wrap; } }
</style>

<body>

<h1 class="sr">Pairwise</h1>
<div class="sign">
  <b>Joy</b>

  <div class="suggest" id="suggest">

    <nav aria-label="站点导航" id="nav">

</div>
<a class="gh" href="https://github.com/Joy-jinyu" aria-label="GitHub" rel="me"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
<div class="cursor you" id="you"><svg viewBox="0 0 17 17"><path d="M2 1.6 15 7.8 8.9 9.4 6.6 15.4z" fill="#f4f4ef" stroke="#0b0c0e" stroke-width="1.1" stroke-linejoin="round"/></svg><b>Joy</b></div>
<div class="cursor ai" id="ai"><svg viewBox="0 0 17 17"><path d="M2 1.6 15 7.8 8.9 9.4 6.6 15.4z" fill="#3ee6d2" stroke="#00231f" stroke-width="1.1" stroke-linejoin="round"/></svg><b>AI</b><span class="say" id="say"></span></div>
<script>
  const cv = document.getElementById('c'), ctx = cv.getContext('2d')
  const youEl = document.getElementById('you'), aiEl = document.getElementById('ai'), say = document.getElementById('say')
  const suggest = document.getElementById('suggest'), nav = document.getElementById('nav'), hint = document.getElementById('hint')
  const links = [...nav.querySelectorAll('a')]
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  const fine = matchMedia('(pointer: fine)').matches
  let W, H, dpr, P = [], step, t0, wordBox = { x: 0, y: 0, w: 0, h: 0 }

  /* ---------- 粒子：「Pairwise」由 token 组成 ---------- */
  function sample() {
    dpr = Math.min(2, devicePixelRatio || 1)
    W = innerWidth; H = innerHeight
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    const size = Math.min(W * (W < 640 ? 0.235 : 0.17), H * 0.34, 260), cy = H * (W < 640 ? 0.4 : 0.44)
    const off = document.createElement('canvas'), o = off.getContext('2d')
    off.width = W; off.height = H
    o.font = `620 ${size}px Geist`; o.letterSpacing = `${-size * 0.055}px`
    o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#fff'
    o.fillText('Pairwise', W / 2, cy)
    const tw = o.measureText('Pairwise').width
    wordBox = { x: W / 2 - tw / 2, y: cy - size * 0.4, w: tw, h: size * 0.8 }
    const data = o.getImageData(0, 0, W, H).data
    step = Math.max(3, Math.round(size / 46))
    const pts = []
    for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
      if (data[(y * W + x) * 4 + 3] > 128) pts.push([x + (Math.random() - 0.5) * step * 0.6, y + (Math.random() - 0.5) * step * 0.6])
    }
    P = pts.map(([hx, hy]) => ({
      hx, hy, x: -Math.random() * W * 0.4, y: hy + (Math.random() - 0.5) * 80, vx: 0, vy: 0,
      r: Math.random() < 0.12 ? 1.6 : 0.6 + Math.random() * 0.8, ph: Math.random() * 6.28,
      delay: (hx / W) * 900 + Math.random() * 500, nb: -1, q: -1, heat: 0, d: 0,
    }))
    // 每个粒子记一个最近邻，查询点经过时把这些成对关系画出来
    const cell = step * 3, grid = new Map(), key = (x, y) => `${Math.floor(x / cell)},${Math.floor(y / cell)}`
    P.forEach((p, i) => { const k = key(p.hx, p.hy); (grid.get(k) || grid.set(k, []).get(k)).push(i) })
    P.forEach((p, i) => {
      const cx = Math.floor(p.hx / cell), cy2 = Math.floor(p.hy / cell); let best = 1e9
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (const j of grid.get(`${cx + dx},${cy2 + dy}`) || []) {
        if (j === i) continue
        const d = (P[j].hx - p.hx) ** 2 + (P[j].hy - p.hy) ** 2
        if (d < best && d > step * step * 2) { best = d; p.nb = j }
      }
    })
    t0 = performance.now()
    if (reduce) P.forEach((p) => { p.x = p.hx; p.y = p.hy })
  }

  /* ---------- 光标 ---------- */
  const you = { x: -100, y: -100, live: false, last: -1e9, vx: 0, vy: 0 }
  const ai = { x: innerWidth * 0.5, y: innerHeight + 60, vx: 0, vy: 0, tx: 0, ty: 0, mode: 'wander', hold: 0 }

  addEventListener('pointermove', (e) => {
    const now = performance.now(), dt = Math.max(8, now - you.last)
    if (you.live) { you.vx = (e.clientX - you.x) / dt * 16; you.vy = (e.clientY - you.y) / dt * 16 }
    you.x = e.clientX; you.y = e.clientY; you.last = now
    if (e.pointerType === 'mouse') { you.live = true; youEl.classList.add('on'); document.documentElement.classList.add('own-cursor') }
    youEl.style.transform = `translate3d(${you.x - 2}px, ${you.y - 2}px, 0)`
    youEl.classList.toggle('link', !!e.target.closest('a, .hint'))
    wake()
  })
  addEventListener('pointerdown', (e) => {
    youEl.classList.add('press'); wake()
    if (e.pointerType !== 'mouse') { you.x = e.clientX; you.y = e.clientY; you.last = performance.now() }
    // 点空白处：粒子炸开再聚回来；点链接、Tab 提示、GitHub 时不炸
    if (!e.target.closest('a, .hint')) for (const p of P) { p.vx += (Math.random() - 0.5) * 30; p.vy += (Math.random() - 0.5) * 30 }
  })
  addEventListener('pointerup', () => youEl.classList.remove('press'))
  document.documentElement.addEventListener('pointerleave', () => { you.live = false; youEl.classList.remove('on') })

  /* ---------- 入口：交互后 AI 写出补全，接受后才是链接 ---------- */
  let woke = false, accepted = false
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
  function caretPoint() { const r = suggest.getBoundingClientRect(); return { x: r.left + 4, y: r.top + r.height / 2 } }
  async function wake() {
    if (woke) return
    woke = true
    await typed
    await sleep(reduce ? 0 : 450)
    ai.mode = 'suggest'
    // 先飞到补全的位置再开始写，最多等 1.4 秒
    for (let t = 0; t < 1400 && !reduce; t += 50) { const c = caretPoint(); if (Math.hypot(ai.x - c.x, ai.y - c.y) < 36) break; await sleep(50) }
    say.textContent = 'suggesting…'; say.classList.add('on')
    suggest.classList.add('typing')
    await sleep(reduce ? 0 : 700)
    suggest.classList.remove('typing'); suggest.classList.add('ready')
    say.textContent = fine ? 'Tab to accept' : 'tap to accept'
    await sleep(1300)
    say.classList.remove('on')
    if (ai.mode === 'suggest') ai.mode = 'follow'
  }
  function accept(go) {
    if (accepted || !suggest.classList.contains('ready')) return
    accepted = true
    const t1 = performance.now(), dur = reduce ? 1 : 520
    const tick = (t) => {
      const k = Math.min(1, (t - t1) / dur)
      links.forEach((a, i) => a.style.setProperty('--p', Math.max(0, Math.min(1, k * 1.6 - i * 0.3)) * 100 + '%'))
      if (k < 1) return requestAnimationFrame(tick)
      suggest.classList.replace('ready', 'done')
      links.forEach((a) => { a.style.background = 'none'; a.style.color = 'var(--ai)'; a.removeAttribute('tabindex') })
      if (go) location.href = go
    }
    requestAnimationFrame(tick)
    say.classList.remove('on')
  }
  addEventListener('keydown', (e) => {
    wake()
    if (e.key === 'Tab' && !accepted && suggest.classList.contains('ready')) { e.preventDefault(); accept(); setTimeout(() => links[0].focus(), 560) }
  })
  hint.addEventListener('click', () => accept())
  links.forEach((a) => a.addEventListener('click', (e) => { if (!accepted) { e.preventDefault(); accept(a.href) } }))

  /* ---------- 每帧 ---------- */
  let prev = performance.now()
  function frame(t) {
    const dt = Math.min(0.05, (t - prev) / 1000); prev = t
    const el = t - t0
    const idle = !you.live || t - you.last > 2200

    // AI 的目标：跟随时停在 Joy 右下方并略微预判；闲下来就在字上巡游；写补全时停在补全的光标处
    // 停在补全行首的左下方，标签和气泡往下展开，不挡补全文字
    if (ai.mode === 'suggest') { const c = caretPoint(); ai.tx = c.x - 4; ai.ty = c.y + 16 }
    else if (!idle) { ai.mode = 'follow'; ai.tx = you.x + 42 + you.vx * 3; ai.ty = you.y + 30 + you.vy * 3 }
    else {
      ai.mode = 'wander'
      const k = el / 1000
      ai.tx = wordBox.x + wordBox.w * (0.5 + Math.sin(k * 0.37) * 0.46)
      ai.ty = wordBox.y + wordBox.h * (0.5 + Math.sin(k * 0.83 + 1) * 0.42)
    }
    // 略欠阻尼的弹簧：有一点惯性和过冲，像另一个人在操作
    const K = ai.mode === 'wander' ? 34 : 70, C = 2 * Math.sqrt(K) * 0.82
    ai.vx += ((ai.tx - ai.x) * K - ai.vx * C) * dt
    ai.vy += ((ai.ty - ai.y) * K - ai.vy * C) * dt
    ai.x += ai.vx * dt; ai.y += ai.vy * dt
    const tilt = Math.max(-14, Math.min(14, ai.vx * 0.02))
    aiEl.style.transform = `translate3d(${ai.x - 2}px, ${ai.y - 2}px, 0)`
    aiEl.firstElementChild.style.transform = `rotate(${tilt}deg)`
    you.vx *= 0.9; you.vy *= 0.9

    ctx.fillStyle = '#050608'; ctx.fillRect(0, 0, W, H)
    const Q = [{ x: ai.x, y: ai.y, c: '62,230,210', R: Math.min(190, W * 0.22) }]
    if (you.live || (!fine && t - you.last < 1500)) Q.push({ x: you.x, y: you.y, c: '244,244,239', R: Math.min(170, W * 0.2) })

    for (const p of P) {
      if (el > p.delay || reduce) {
        const jx = Math.sin(el * 0.0011 + p.ph) * 0.9, jy = Math.cos(el * 0.0013 + p.ph) * 0.9
        let ax = (p.hx + jx - p.x) * 0.06, ay = (p.hy + jy - p.y) * 0.06
        p.q = -1; p.heat = 0
        for (let qi = 0; qi < Q.length; qi++) {
          const q = Q[qi], dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy
          if (d2 < q.R * q.R) {
            const d = Math.sqrt(d2) || 1, f = (1 - d / q.R) ** 2
            ax += (dx / d) * f * 2; ay += (dy / d) * f * 2
            if (1 - d / q.R > p.heat) { p.heat = 1 - d / q.R; p.q = qi; p.d = d }
          }
        }
        p.vx = (p.vx + ax) * 0.82; p.vy = (p.vy + ay) * 0.82
        p.x += p.vx; p.y += p.vy
      } else p.x += 6
    }

    // 成对连线 + 注意力线
    const settled = (p) => Math.abs(p.x - p.hx) + Math.abs(p.y - p.hy) < step * 6
    ctx.lineWidth = 0.6
    const byQ = Q.map(() => [])
    for (const p of P) if (p.q >= 0 && settled(p)) {
      byQ[p.q].push(p)
      const n = P[p.nb]
      if (n && settled(n)) { ctx.strokeStyle = `rgba(${Q[p.q].c},${p.heat * 0.5})`; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(n.x, n.y); ctx.stroke() }
    }
    ctx.lineWidth = 0.5
    byQ.forEach((arr, qi) => {
      arr.sort((a, b) => a.d - b.d)
      for (const p of arr.slice(0, 24)) { ctx.strokeStyle = `rgba(${Q[qi].c},${p.heat ** 1.5 * 0.32})`; ctx.beginPath(); ctx.moveTo(Q[qi].x, Q[qi].y); ctx.lineTo(p.x, p.y); ctx.stroke() }
    })
    // 两个光标之间的那一根线：Pairwise 的「一对」
    if (Q.length > 1) {
      const g = ctx.createLinearGradient(Q[1].x, Q[1].y, Q[0].x, Q[0].y)
      g.addColorStop(0, 'rgba(244,244,239,0.35)'); g.addColorStop(1, 'rgba(62,230,210,0.5)')
      ctx.strokeStyle = g; ctx.lineWidth = 0.8; ctx.setLineDash([2, 4])
      ctx.beginPath(); ctx.moveTo(Q[1].x, Q[1].y); ctx.lineTo(Q[0].x, Q[0].y); ctx.stroke(); ctx.setLineDash([])
    }
    for (const p of P) {
      const s = p.r + p.heat * 1.2
      ctx.fillStyle = p.heat > 0.04 ? `rgba(${Q[p.q].c},${0.45 + p.heat * 0.55})` : 'rgba(238,240,243,0.72)'
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s)
    }
    requestAnimationFrame(frame)
  }

  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(sample, 150) })
  // 「Joy」下面那行逐字打出来；整句一直在 DOM 里，没打到的部分隐藏
  const tagEl = document.getElementById('tag'), full = tagEl.textContent
  let typedDone
  const typed = new Promise((r) => (typedDone = r))
  async function typewriter() {
    if (reduce) return typedDone()
    tagEl.innerHTML = '<span class="done"></span><i class="tc" aria-hidden="true"></i><span class="rest"></span>'
    tagEl.setAttribute('aria-label', full)
    const [done, tc, rest] = tagEl.children
    rest.textContent = full
    await sleep(1100)
    for (let n = 1; n <= full.length; n++) {
      done.textContent = full.slice(0, n); rest.textContent = full.slice(n)
      const ch = full[n - 1]
      await sleep(ch === ' ' ? 70 : /[&,.]/.test(ch) ? 180 : 32 + Math.random() * 46)
    }
    tc.classList.add('blink'); await sleep(1600)
    tc.classList.add('gone'); typedDone()
    await sleep(320)
    tagEl.textContent = full; tagEl.removeAttribute('aria-label')
  }

  document.fonts.load('620 100px Geist').then(() => {
    typewriter()
    sample(); aiEl.classList.add('on'); requestAnimationFrame(frame)
  })
</script>
</body>
</html>
